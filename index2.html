<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>医系生物(空欄補充・記述式)</title>
    <style>
        :root {
            --bg-color: #0a0f1d;
            --card-bg: #131a30;
            --text-color: #e2e8f0;
            --accent-color: #00f2fe;
            --success-color: #00e676;
            --error-color: #ff1744;
            --border-color: #222f54;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 40px 20px;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 900px;
            background: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 8px 32px 0 rgba(0, 242, 254, 0.1);
            border: 1px solid var(--border-color);
            padding: 30px;
            transition: all 0.3s ease;
        }

        h1 {
            text-align: center;
            font-size: 2rem;
            margin-bottom: 25px;
            color: #fff;
            text-shadow: 0 0 10px var(--accent-color);
            letter-spacing: 2px;
        }

        .screen { display: none; }
        .screen.active {
            display: block;
            animation: fadeIn 0.5s ease forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* メニュー画面 */
        .menu-description {
            text-align: center;
            color: #94a3b8;
            margin-bottom: 20px;
            line-height: 1.6;
        }

        .menu-controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .text-btn {
            background: none;
            border: 1px solid var(--accent-color);
            color: var(--accent-color);
            padding: 6px 16px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .text-btn:hover {
            background: rgba(0, 242, 254, 0.1);
        }

        .question-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }

        .q-checkbox-label {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(34, 47, 84, 0.4);
            border: 1px solid var(--border-color);
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            user-select: none;
        }
        .q-checkbox-label:hover {
            background: rgba(0, 242, 254, 0.08);
            border-color: var(--accent-color);
        }
        .q-checkbox-label input {
            accent-color: var(--accent-color);
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        /* クイズ画面 */
        .progress-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px;
            margin-bottom: 20px;
            font-size: 1.1rem;
            color: var(--accent-color);
            font-weight: bold;
        }

        .question-text-area {
            font-size: 1.15rem;
            line-height: 2.2;
            margin-bottom: 30px;
        }

        /* 空欄入力UI */
        .input-wrapper {
            display: inline-block;
            position: relative;
            margin: 0 4px;
        }

        .blank-input {
            background: rgba(0, 242, 254, 0.05);
            border: none;
            border-bottom: 2px solid var(--border-color);
            color: #fff;
            padding: 4px 8px;
            border-radius: 4px 4px 0 0;
            font-size: 1.1rem;
            text-align: center;
            min-width: 100px;
            max-width: 250px;
            transition: all 0.3s;
            outline: none;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        .blank-input::placeholder {
            color: #4b5563;
            font-size: 0.9rem;
        }
        .blank-input:focus {
            background: rgba(0, 242, 254, 0.15);
            border-bottom-color: var(--accent-color);
        }

        /* 正誤判定スタイル */
        .blank-input.correct {
            border-bottom-color: var(--success-color);
            background: rgba(0, 230, 118, 0.15);
            color: var(--success-color);
        }
        .blank-input.incorrect {
            border-bottom-color: var(--error-color);
            background: rgba(255, 23, 68, 0.15);
            color: #ff8a80;
            text-decoration: line-through;
        }

        .correct-reveal {
            position: absolute;
            bottom: 100%;
            left: 50%;
            transform: translateX(-50%);
            background: var(--success-color);
            color: #000;
            font-size: 0.8rem;
            font-weight: bold;
            padding: 2px 8px;
            border-radius: 4px;
            white-space: nowrap;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s;
            margin-bottom: 4px;
            box-shadow: 0 2px 8px rgba(0,230,118,0.4);
        }
