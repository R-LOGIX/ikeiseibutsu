<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>医系生物(選択式問題10年分)</title>
<style>
  :root {
    --bg-color: #0f172a;
    --card-bg: #1e293b;
    --text-main: #f8fafc;
    --text-muted: #94a3b8;
    --accent: #38bdf8;
    --accent-hover: #0284c7;
    --correct: #10b981;
    --incorrect: #ef4444;
    --border: #334155;
  }

  * { box-sizing: border-box; font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif; }
  
  body {
    margin: 0; padding: 0;
    background-color: var(--bg-color);
    color: var(--text-main);
    display: flex; justify-content: center; align-items: center;
    min-height: 100vh;
    line-height: 1.6;
  }

  #app {
    width: 100%; max-width: 800px;
    min-height: 100vh;
    padding: 20px;
    display: flex; flex-direction: column;
  }

  /* Screens */
  .screen { display: none; flex-direction: column; flex-grow: 1; animation: fadeIn 0.4s ease; }
  .screen.active { display: flex; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* Header */
  header {
    text-align: center; margin-bottom: 30px;
    border-bottom: 2px solid var(--border);
    padding-bottom: 20px;
  }
  h1 { font-size: 1.8rem; margin: 0; color: var(--accent); letter-spacing: 1px; }
  .progress { font-size: 0.9rem; color: var(--text-muted); margin-top: 10px; }

  /* Card */
  .card {
    background: var(--card-bg);
    border-radius: 12px;
    padding: 30px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    border: 1px solid var(--border);
    margin-bottom: 20px;
  }

  .question-title { font-size: 1.3rem; font-weight: bold; margin-top: 0; color: var(--accent); border-left: 4px solid var(--accent); padding-left: 10px;}
  .question-text { font-size: 1.1rem; margin-bottom: 25px; white-space: pre-wrap; }

  /* Options */
  .options-container { display: flex; flex-direction: column; gap: 12px; }
  
  .option-btn {
    background: transparent; border: 2px solid var(--border);
    color: var(--text-main); padding: 15px; border-radius: 8px;
    text-align: left; font-size: 1rem; cursor: pointer;
    transition: all 0.2s ease;
  }
  .option-btn:hover { border-color: var(--accent); background: rgba(56, 189, 248, 0.05); }
  .option-btn.selected { border-color: var(--accent); background: rgba(56, 189, 248, 0.15); box-shadow: 0 0 10px rgba(56,189,248,0.3); }

  /* Sequence / Multi-part Specific */
  .sequence-part {
    margin-bottom: 20px;
    padding-bottom: 15px;
    border-bottom: 1px dashed var(--border);
  }
  .sequence-part:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
  .sequence-label { margin-bottom: 10px; font-weight: bold; display: block;}
  .sequence-options { display: flex; flex-wrap: wrap; gap: 10px; }
  
  .seq-btn {
    flex: 1; min-width: 60px;
    background: transparent; border: 2px solid var(--border);
    color: var(--text-main); padding: 10px; border-radius: 6px;
    text-align: center; cursor: pointer; transition: all 0.2s;
  }
  .seq-btn.selected { border-color: var(--accent); background: rgba(56, 189, 248, 0.2); }

  /* Action Buttons */
  .submit-btn, .next-btn, .start-btn {
    background: var(--accent); color: #fff;
    border: none; padding: 15px 30px; border-radius: 8px;
    font-size: 1.1rem; font-weight: bold; cursor: pointer;
    transition: background 0.2s; align-self: center;
    margin-top: 20px; width: 100%; max-width: 300px;
  }
  .submit-btn:hover, .next-btn:hover, .start-btn:hover { background: var(--accent-hover); }
  .submit-btn:disabled { background: var(--border); color: var(--text-muted); cursor: not-allowed; }

  /* Feedback Overlay */
  .feedback {
    display: none; padding: 20px; border-radius: 8px; margin-top: 20px; text-align: center; font-weight: bold;
    animation: fadeIn 0.3s ease;
  }
  .feedback.correct { display: block; background: rgba(16, 185, 129, 0.1); border: 2px solid var(--correct); color: var(--correct); }
  .feedback.incorrect { display: block; background: rgba(239, 68, 68, 0.1); border: 2px solid var(--incorrect); color: var(--incorrect); }
  .correct-answer-text { color: var(--text-main); font-weight: normal; margin-top: 10px; display: block; }

  /* Result Screen */
  #result-screen { text-align: center; justify-content: center; }
  .score-display { font-size: 3rem; font-weight: bold; color: var(--accent); margin: 20px 0; }
  
</style>
</head>
<body>

<div id="app">
  <div id="start-screen" class="screen active">
    <div class="card" style="text-align: center; padding: 50px 20px;">
      <h1>医系生物<br><span style="font-size: 1.2rem; color: var(--text-muted);">(選択式問題10年分)</span></h1>
      <p style="margin-top: 30px; margin-bottom: 40px;">全36問・順不同で出題されます。</p>
      <button class="start-btn" onclick="startQuiz()">クイズを開始する</button>
    </div>
  </div>

  <div id="quiz-screen" class="screen">
    <header>
      <h1>医系生物(選択式問題10年分)</h1>
      <div class="progress" id="progress-text">問題 1 / 36</div>
    </header>
    
    <div class="card">
      <h2 class="question-title" id="q-title">問X</h2>
      <div class="question-text" id="q-text">問題文</div>
      
      <div id="options-area"></div>
      
      <div id="feedback-area" class="feedback"></div>
    </div>

    <button id="submit-btn" class="submit-btn" onclick="checkAnswer()" disabled>解答する</button>
    <button id="next-btn" class="next-btn" onclick="nextQuestion()" style="display: none;">次の問題へ</button>
  </div>

  <div id="result-screen" class="screen">
    <div class="card">
      <h1>結果発表</h1>
      <div class="score-display" id="final-score">0 / 36</div>
      <p id="score-message">お疲れ様でした！</p>
      <button class="start-btn" onclick="location.reload()">最初からやり直す</button>
    </div>
  </div>
</div>

<script>
// --- Data ---
const rawQuestions = [
  { id: "q5", title: "問５", text: "直接のエネルギー供給が必要なのはどれか。", type: "single", options: [{id:"A", text:"（A）拡散"},{id:"B", text:"（B）能動輸送"},{id:"C", text:"（C）浸透"},{id:"D", text:"（D）受動輸送"}], answer: "B" },
  { id: "q6", title: "問６", text: "水は細胞が次のどの液にあるときに外へ出て行くか。", type: "single", options: [{id:"A", text:"（A）低張液"},{id:"B", text:"（B）等張液"},{id:"C", text:"（C）高張液"},{id:"D", text:"（D）上のどれでもない"}], answer: "C" },
  { id: "q7", title: "問７", text: "細胞が低張液の中にあるとき、水は細胞に対してどのように動くか。", type: "single", options: [{id:"A", text:"（A）細胞の外へ出ていく"},{id:"B", text:"（B）細胞の中へ入っていく"},{id:"C", text:"（C）細胞膜を通らない"},{id:"D", text:"（D）上のどれでもない"}], answer: "B" },
  { id: "q8", title: "問８", text: "酸化的リン酸化においてATP合成酵素によるATP合成の直接のエネルギー源は次のうちどれか。", type: "single", options: [{id:"A", text:"（A）グルコースと他の有機化合物の酸化"},{id:"B", text:"（B）電子伝達系を下る電子の流れ"},{id:"C", text:"（C）ATP合成酵素をもつ膜を介したH⁺濃度勾配"},{id:"D", text:"（D）リン酸のADPへの転移"}], answer: "C" },
  { id: "q10", title: "問１０", text: "ミトコンドリアの電子伝達鎖に電子が流れる時、次のどれが起こるか。", type: "single", options: [{id:"A", text:"（A）ミトコンドリアマトリックスのpHが上昇する。"},{id:"B", text:"（B）ATP合成酵素が能動輸送によってプロトンを輸送する。"},{id:"C", text:"（C）電子が自由エネルギーを獲得する。"},{id:"D", text:"（D）NAD⁺が酸化される。"}], answer: "A" },
  { id: "q13", title: "問１３", text: "細胞膜のNa⁺/K⁺-ATPaseによるATP加水分解を促進する薬剤を摂取すれば、次のどの現象が起こるか。", type: "single", options: [{id:"A", text:"（A）ミトコンドリア内膜のpH勾配は増加する。"},{id:"B", text:"（B）ミトコンドリアのNADHをNAD⁺に酸化する速度は低下する。"},{id:"C", text:"（C）発熱が減少する。"},{id:"D", text:"（D）O₂に電子を伝達する速度は増加する。"}], answer: "D" },
  { id: "q15", title: "問１５", text: "次のうち、間違っているのはどれか。", type: "single", options: [{id:"A", text:"（A）好気性生物は必要なATPの大部分を解糖系でつくる。"},{id:"B", text:"（B）解糖系でピルビン酸がつくられ、クエン酸回路でピルビン酸が消費される。"},{id:"C", text:"（C）解糖系は細胞質（細胞質基質）で進行する。"},{id:"D", text:"（D）解糖系は細胞呼吸の最初の段階となる。"}], answer: "A" },
  { id: "q16", title: "問１６", text: "次の記述の正誤を判断せよ。\n（A）嫌気性生物は必要なATPを解糖系でつくる。\n（B）解糖系でクエン酸がつくられ、クエン酸回路で消費される。\n（C）解糖系は細胞質（細胞質基質）で進行する。\n（D）解糖系は細胞呼吸の最初の段階となる。", type: "sequence", parts: [{label:"（A）", options:[{id:"〇", text:"〇"},{id:"×", text:"×"}]},{label:"（B）", options:[{id:"〇", text:"〇"},{id:"×", text:"×"}]},{label:"（C）", options:[{id:"〇", text:"〇"},{id:"×", text:"×"}]},{label:"（D）", options:[{id:"〇", text:"〇"},{id:"×", text:"×"}]}], answer: ["〇","×","〇","〇"] },
  { id: "q20", title: "問２０", text: "クエン酸回路の主要な機能はどれか。", type: "single", options: [{id:"A", text:"（A）CO₂を発生すること"},{id:"B", text:"（B）アセチル-CoAのアセチル基の電子をNAD⁺とFADに渡すこと"},{id:"C", text:"（C）アセチル-CoAのアセチル部分をオキサロ酢酸に酸化すること"},{id:"D", text:"（D）アセチル-CoAのアセチル部分を酸化して熱を発生すること"},{id:"E", text:"（E）過剰のピルビン酸と脂肪酸を処理すること"}], answer: "B" },
  { id: "q21", title: "問２１", text: "ファンデルワールス力と水素結合の2種類の結合のうち、（１）～（３）の部分にできるのはどちらか。記号で答えよ。\n（A）ファンデルワールス力　（B）水素結合　（C）ファンデルワールス力と水素結合の両方", type: "sequence", parts: [{label:"（１）炭素に結合した水素原子どうしの間", options:[{id:"A", text:"A"},{id:"B", text:"B"},{id:"C", text:"C"}]},{label:"（２）窒素原子と、炭素に結合した水素原子との間", options:[{id:"A", text:"A"},{id:"B", text:"B"},{id:"C", text:"C"}]},{label:"（３）窒素原子と、酸素に結合した水素原子との間", options:[{id:"A", text:"A"},{id:"B", text:"B"},{id:"C", text:"C"}]}], answer: ["A","A","C"] },
  { id: "q22", title: "問２２", text: "次の生物のうち、膜の不飽和リン脂質の割合が最も高いと思われるのはどれか。", type: "single", options: [{id:"A", text:"A) 南極海の魚"},{id:"B", text:"B) 砂漠のヘビ"},{id:"C", text:"C) 人類"},{id:"D", text:"D) ホッキョクグマ"},{id:"E", text:"E) 100℃の温泉に住む好熱性細菌"}], answer: "A" },
  { id: "q23", title: "問２３", text: "次の文章中の｛｝の部分について正しいものを選べ。", type: "sequence", parts: [{label:"１．基質濃度［S］がKₘよりもはるかに小さいとき、酵素のほとんどの活性部位に基質が", options:[{id:"A", text:"（A）結合している"},{id:"B", text:"（B）結合していない"}]},{label:"２．基質濃度［S］がKₘよりもはるかに大きいときは、反応速度は", options:[{id:"A", text:"（A）酵素濃度"},{id:"B", text:"（B）基質濃度"}]}], answer: ["B","A"] },
  { id: "q24", title: "問２４", text: "以下の文章の続きとして正しいものを選べ。また、その理由を説明せよ。\n酵素の競合阻害剤となる薬剤は、", type: "single", options: [{id:"A", text:"（A）Vₘₐₓを増加させるが、Kₘを変えない。"},{id:"B", text:"（B）Vₘₐₓを減少させるが、Kₘを変えない。"},{id:"C", text:"（C）Kₘを増加させるが、Vₘₐₓを変えない。"},{id:"D", text:"（D）Kₘを減少させるが、Vₘₐₓを変えない。"},{id:"E", text:"（E）Vₘₐₓ、Kₘともに減少させる。"}], answer: "C" },
  { id: "q25", title: "問２５", text: "以下の文章の続きとして正しいものを選べ。", type: "sequence", parts: [{label:"１．酵素の活性部位は", options:[{id:"A", text:"（A）特異的基質が加えられた時のみ、形成される。"},{id:"B", text:"（B）アロステリック阻害剤の結合に直接関与する。"},{id:"C", text:"（C）ポリペプチド鎖の一次構造で隣り合ういくつかのアミノ酸残基に存在する。"},{id:"D", text:"（D）競合阻害剤と結合する。"}]},{label:"２．酵素触媒反応の速度（v）は", options:[{id:"A", text:"（A）基質濃度が増加すると減少する。"},{id:"B", text:"（B）酵素が基質で飽和されたときに最も低い。"},{id:"C", text:"（C）1/2Vₘₐₓを与える基質濃度の関数である。"},{id:"D", text:"（D）溶液のpHとは無関係である。"}]}], answer: ["D","C"] },
  { id: "q26", title: "問２６", text: "反応 E + S ⇄ ES → E + P を触媒する酵素反応に2mMの基質を加える。初期反応速度はVₘₐₓの20%である。この酵素のKₘはどれか。酵素反応速度はミカエリス・メンテン式\nv＝Vₘₐₓ［S］/（Kₘ＋［S］）\nで与えられる。", type: "single", options: [{id:"A", text:"（A）2mM"},{id:"B", text:"（B）4mM"},{id:"C", text:"（C）8mM"},{id:"D", text:"（D）12mM"},{id:"E", text:"（E）25mM"}], answer: "C" },
  { id: "q28", title: "問２８", text: "減量希望の化学者がジニトロフェノール（DNP）を入手し、服用前に医師に相談したところ、DNPは脱共役剤で減量のための服用は危険だといわれた。もし多量のDNPを服用すれば彼女のミトコンドリアで何が起こるか。次の記述について、正しいものには○、間違っているものには×を付けなさい。", type: "sequence", parts: [{label:"（A）O₂消費が減少する。", options:[{id:"〇", text:"〇"},{id:"×", text:"×"}]},{label:"（B）CO₂発生が減少する。", options:[{id:"〇", text:"〇"},{id:"×", text:"×"}]},{label:"（C）プロトン濃度勾配が増加する。", options:[{id:"〇", text:"〇"},{id:"×", text:"×"}]},{label:"（D）NADHの酸化速度が増加する。", options:[{id:"〇", text:"〇"},{id:"×", text:"×"}]},{label:"（E）体温が下がる。", options:[{id:"〇", text:"〇"},{id:"×", text:"×"}]}], answer: ["×","×","×","〇","×"] },
  { id: "q30", title: "問３０", text: "次の反応のうち、エネルギー的に起こりやすい反応と共役させたときにだけ起こるのはどれか。3つ選べ。", type: "multi", req: 3, options: [{id:"A", text:"（A）グルコース + O₂ → CO₂ + H₂O"},{id:"B", text:"（B）CO₂ + H₂O → グルコース + O₂"},{id:"C", text:"（C）ヌクレオチド塩基 → ヌクレオチド三リン酸"},{id:"D", text:"（D）ヌクレオチド三リン酸 → DNA"},{id:"E", text:"（E）ADP + Pᵢ → ATP"}], answer: ["B","C","E"] },
  { id: "q31", title: "問３１", text: "細胞が行う過程で、ヒトが呼吸で吐き出す二酸化炭素が生じる過程はどの過程か。2つ選べ。", type: "multi", req: 2, options: [{id:"A", text:"（A）解糖"},{id:"B", text:"（B）乳酸発酵"},{id:"C", text:"（C）ピルビン酸からアセチルCoAへの変換"},{id:"D", text:"（D）クエン酸回路"},{id:"E", text:"（E）電子伝達"}], answer: ["C","D"] },
  { id: "q32", title: "問３２", text: "異化過程に由来するほとんどのCO₂は次のどの過程で放出されるか。", type: "single", options: [{id:"A", text:"（A）解糖"},{id:"B", text:"（B）クエン酸回路"},{id:"C", text:"（C）乳酸発酵"},{id:"D", text:"（D）電子伝達"}], answer: "B" },
  { id: "q33", title: "問３３", text: "ヒトが呼吸している酸素のほとんどは次のどの過程で消費されるか。", type: "single", options: [{id:"A", text:"（A）解糖"},{id:"B", text:"（B）乳酸発酵"},{id:"C", text:"（C）ピルビン酸からアセチルCoAへの変換"},{id:"D", text:"（D）クエン酸回路"},{id:"E", text:"（E）電子伝達"}], answer: "E" },
  { id: "q34", title: "問３４", text: "好気的な酸化的リン酸化で機能する電子伝達鎖の最終的な電子伝達体は、次のうちどれか。", type: "single", options: [{id:"A", text:"（A）酸素"},{id:"B", text:"（B）水"},{id:"C", text:"（C）NAD⁺"},{id:"D", text:"（D）ピルビン酸"}], answer: "A" },
  { id: "q35", title: "問３５", text: "次の文を正しく完成するように選択肢から1つ選べ。\nAとaが同じ遺伝子の異なる対立遺伝子であるとき、Aaの遺伝子型の個体は、", type: "single", options: [{id:"A", text:"（A）ホモ接合体である。"},{id:"B", text:"（B）ヘテロ接合体である。"},{id:"C", text:"（C）優性である。"},{id:"D", text:"（D）劣性である。"}], answer: "B" },
  { id: "q38", title: "問３８", text: "ある子供がAB型の血液型をもつとすると、その両親についてはどのようなことがいえるか。正しい文を選べ。", type: "single", options: [{id:"A", text:"（A）両親ともヘテロ接合体である。"},{id:"B", text:"（B）両親ともA型かO型でありうるが、AB型ではない。"},{id:"C", text:"（C）両親ともAB型である。"},{id:"D", text:"（D）両親ともO型ではない。"}], answer: "D" },
  { id: "q45", title: "問４５", text: "二遺伝子雑種交雑のF₂世代（雑種第二代）について正しいのはどれか。", type: "single", options: [{id:"A", text:"（A）もし遺伝子座がつながっていれば、4つの表現型が比率9：3：3：1で現れる。"},{id:"B", text:"（B）もし遺伝子座がつながっていなければ、4つの表現型が比率9：3：3：1で現れる。"},{id:"C", text:"（C）もし遺伝子座がつながっていなければ、2つの表現型が比率3：1で現れる。"},{id:"D", text:"（D）もし遺伝子座がつながっていれば、3つの表現型が比率1：2：1で現れる。"}], answer: "B" },
  { id: "q46", title: "問４６", text: "連鎖している遺伝子について正しいのはどれか。", type: "single", options: [{id:"A", text:"（A）染色体上で互いに隣接していなければならない。"},{id:"B", text:"（B）互いに独立して分離される対立遺伝子をもつ。"},{id:"C", text:"（C）同じ染色体上にある。"},{id:"D", text:"（D）常に交差する。"}], answer: "C" },
  { id: "q47", title: "問４７", text: "大腸菌培養による組換えDNAの大量調整を何というか。", type: "single", options: [{id:"A", text:"（A）PCR"},{id:"B", text:"（B）DNAポリメラーゼ"},{id:"C", text:"（C）DNAライゲーション"},{id:"D", text:"（D）DNAクローニング"}], answer: "D" },
  { id: "q48", title: "問４８", text: "色素性乾皮症の患者が太陽光に露光すると皮膚がんまで進行するが、これは以下の欠損による。", type: "single", options: [{id:"A", text:"（A）複製複合体の酵素プライマーゼ"},{id:"B", text:"（B）DNAポリメラーゼ"},{id:"C", text:"（C）ヌクレオチド除去修復酵素"},{id:"D", text:"（D）ヘリカーゼ"}], answer: "C" },
  { id: "q49", title: "問４９", text: "色素性乾皮症の患者はUVに露光するとDNA障害を受けるが、これはUV光により、", type: "single", options: [{id:"A", text:"（A）DNA中にリボース三量体ができるから。"},{id:"B", text:"（B）DNA中にチミン二量体ができるから。"},{id:"C", text:"（C）DNA中にデオキシリボース二量体ができるから。"},{id:"D", text:"（D）DNA中のリン酸基間に酸無水物結合ができるから。"}], answer: "B" },
  { id: "q50", title: "問５０", text: "DNAの複製に関して正しい記述はどれか。", type: "single", options: [{id:"A", text:"（A）細胞周期のM期で行われる。"},{id:"B", text:"（B）5’から3’方向へコピーするDNA鋳型が必要である。"},{id:"C", text:"（C）染色体上の複製起点から両方向に進む。"},{id:"D", text:"（D）新規に合成した1本の二重らせんと2本の親鎖からなる二重らせんをつくる。"}], answer: "C" },
  { id: "q51", title: "問５１", text: "DNAの複製に関して正しい記述はどれか。", type: "single", options: [{id:"A", text:"（A）細胞周期のM期で行われる。"},{id:"B", text:"（B）3’から5’方向へコピーするDNA鋳型が必要である。"},{id:"C", text:"（C）染色体上の複製起点から一方向に進む。"},{id:"D", text:"（D）新規に合成した1本の二重らせんと2本の親鎖からなる二重らせんをつくる。"}], answer: "B" },
  { id: "q52", title: "問５２", text: "DNAポリメラーゼ活性に必要なのはどれか。", type: "single", options: [{id:"A", text:"（A）dUTP"},{id:"B", text:"（B）5’-ヒドロキシ基"},{id:"C", text:"（C）3’-ヒドロキシ基"},{id:"D", text:"（D）CTP"}], answer: "C" },
  { id: "q53", title: "問５３", text: "岡崎フラグメントに関して正しい記述はどれか。", type: "single", options: [{id:"A", text:"（A）複製のときラギング鎖でつくられる。"},{id:"B", text:"（B）タンパク質のアミノ酸をコードしていないDNA領域である。"},{id:"C", text:"（C）5’末端に少数のデオキシリボヌクレオチドをもつ比較的短いポリリボヌクレオチドである。"},{id:"D", text:"（D）選択的スプライシングにより生じる生成物である。"}], answer: "A" },
  { id: "q54", title: "問５４", text: "DNAを特異的な配列で切断するものはどれか。", type: "single", options: [{id:"A", text:"（A）DNAリガーゼ"},{id:"B", text:"（B）DNAポリメラーゼ"},{id:"C", text:"（C）制限酵素"},{id:"D", text:"（D）ヘリカーゼ"}], answer: "C" },
  { id: "q55", title: "問５５", text: "遺伝子の両端のDNA配列が判明している場合、数時間で数十億倍に遺伝子を増幅する方法はどれか。", type: "single", options: [{id:"A", text:"（A）PCR"},{id:"B", text:"（B）DNAポリメラーゼ"},{id:"C", text:"（C）DNAライゲーション"},{id:"D", text:"（D）DNAクローニング"}], answer: "A" },
  { id: "q57", title: "問５７", text: "DNAのリーディング鎖とラギング鎖の複製方法が異なる根本的な理由は次のうちどれか。", type: "single", options: [{id:"A", text:"（A）複製の開始が5’末端のみから起こること。"},{id:"B", text:"（B）ヘリカーゼと1本鎖結合タンパク質が5’末端で働いていること。"},{id:"C", text:"（C）DNAポリメラーゼが新たなヌクレオチドを伸長中の鎖の3’末端にしか付加できないこと。"},{id:"D", text:"（D）DNAリガーゼが3’→5’方向にしか働かないこと。"}], answer: "C" },
  { id: "q64", title: "問６４", text: "5’-AGCCAATT-3’配列を含むDNAフラグメントを転写の鋳型として使えば、転写されるRNA配列はどれか。", type: "single", options: [{id:"A", text:"（A）5’-UCGGUUAA-3’"},{id:"B", text:"（B）5’-AAUUGGCU-3’"},{id:"C", text:"（C）5’-AGCCAAUU-3’"},{id:"D", text:"（D）5’-UUAACCGA-3’"}], answer: "B" }
];

// --- Application State ---
let questions = [];
let currentIndex = 0;
let score = 0;
let userSelection = null; // String, Array, or Object depending on type
let audioCtx;

// --- Utility Functions ---
function shuffleArray(array) {
  let curId = array.length;
  while (0 !== curId) {
    let randId = Math.floor(Math.random() * curId);
    curId -= 1;
    let tmp = array[curId];
    array[curId] = array[randId];
    array[randId] = tmp;
  }
  return array;
}

// --- Audio Functions (Web Audio API) ---
function initAudio() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if (audioCtx.state === 'suspended') {
    audioCtx.resume();
  }
}

function playCorrectSound() {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.type = 'sine';
  osc.frequency.setValueAtTime(880, audioCtx.currentTime); // A5
  osc.frequency.exponentialRampToValueAtTime(1760, audioCtx.currentTime + 0.1); // A6
  gain.gain.setValueAtTime(0, audioCtx.currentTime);
  gain.gain.linearRampToValueAtTime(0.3, audioCtx.currentTime + 0.05);
  gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
  osc.start(audioCtx.currentTime);
  osc.stop(audioCtx.currentTime + 0.4);
}

function playIncorrectSound() {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.type = 'sawtooth';
  osc.frequency.setValueAtTime(150, audioCtx.currentTime);
  gain.gain.setValueAtTime(0, audioCtx.currentTime);
  gain.gain.linearRampToValueAtTime(0.3, audioCtx.currentTime + 0.05);
  gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
  osc.start(audioCtx.currentTime);
  osc.stop(audioCtx.currentTime + 0.4);
}

// --- Core Logic ---
function switchScreen(screenId) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(screenId).classList.add('active');
}

function startQuiz() {
  initAudio();
  questions = shuffleArray([...rawQuestions]);
  currentIndex = 0;
  score = 0;
  switchScreen('quiz-screen');
  renderQuestion();
}

function renderQuestion() {
  const q = questions[currentIndex];
  document.getElementById('progress-text').innerText = `問題 ${currentIndex + 1} / ${questions.length}`;
  document.getElementById('q-title').innerText = q.title;
  document.getElementById('q-text').innerText = q.text;
  
  const optionsArea = document.getElementById('options-area');
  optionsArea.innerHTML = '';
  
  const submitBtn = document.getElementById('submit-btn');
  submitBtn.style.display = 'block';
  submitBtn.disabled = true;
  document.getElementById('next-btn').style.display = 'none';
  
  const feedbackArea = document.getElementById('feedback-area');
  feedbackArea.className = 'feedback';
  feedbackArea.innerHTML = '';

  userSelection = q.type === 'sequence' ? [] : (q.type === 'multi' ? [] : null);

  if (q.type === 'single') {
    const container = document.createElement('div');
    container.className = 'options-container';
    q.options.forEach(opt => {
      const btn = document.createElement('button');
      btn.className = 'option-btn';
      btn.innerText = opt.text;
      btn.onclick = () => {
        container.querySelectorAll('.option-btn').forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
        userSelection = opt.id;
        submitBtn.disabled = false;
      };
      container.appendChild(btn);
    });
    optionsArea.appendChild(container);
  } 
  else if (q.type === 'multi') {
    const container = document.createElement('div');
    container.className = 'options-container';
    q.options.forEach(opt => {
      const btn = document.createElement('button');
      btn.className = 'option-btn';
      btn.innerText = opt.text;
      btn.onclick = () => {
        if (userSelection.includes(opt.id)) {
          userSelection = userSelection.filter(v => v !== opt.id);
          btn.classList.remove('selected');
        } else {
          if (userSelection.length < q.req) {
            userSelection.push(opt.id);
            btn.classList.add('selected');
          }
        }
        submitBtn.disabled = userSelection.length !== q.req;
      };
      container.appendChild(btn);
    });
    optionsArea.appendChild(container);
  }
  else if (q.type === 'sequence') {
    q.parts.forEach((part, index) => {
      const pDiv = document.createElement('div');
      pDiv.className = 'sequence-part';
      
      const label = document.createElement('div');
      label.className = 'sequence-label';
      label.innerText = part.label;
      pDiv.appendChild(label);
      
      const optContainer = document.createElement('div');
      optContainer.className = 'sequence-options';
      
      part.options.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = 'seq-btn';
        btn.innerText = opt.text;
        btn.onclick = () => {
          optContainer.querySelectorAll('.seq-btn').forEach(b => b.classList.remove('selected'));
          btn.classList.add('selected');
          userSelection[index] = opt.id;
          
          const allAnswered = userSelection.length === q.parts.length && !userSelection.includes(undefined);
          submitBtn.disabled = !allAnswered;
        };
        optContainer.appendChild(btn);
      });
      pDiv.appendChild(optContainer);
      optionsArea.appendChild(pDiv);
    });
  }
}

function checkAnswer() {
  const q = questions[currentIndex];
  let isCorrect = false;
  let correctStr = '';

  if (q.type === 'single') {
    isCorrect = (userSelection === q.answer);
    correctStr = q.answer;
  } 
  else if (q.type === 'multi') {
    isCorrect = (userSelection.sort().join('') === [...q.answer].sort().join(''));
    correctStr = q.answer.join(', ');
  } 
  else if (q.type === 'sequence') {
    isCorrect = (userSelection.join('') === q.answer.join(''));
    correctStr = q.answer.join(' → ');
  }

  const feedbackArea = document.getElementById('feedback-area');
  
  if (isCorrect) {
    score++;
    playCorrectSound();
    feedbackArea.innerHTML = `正解！`;
    feedbackArea.className = 'feedback correct';
  } else {
    playIncorrectSound();
    feedbackArea.innerHTML = `不正解... <span class="correct-answer-text">正解: ${correctStr}</span>`;
    feedbackArea.className = 'feedback incorrect';
  }

  // Lock UI
  document.querySelectorAll('button.option-btn, button.seq-btn').forEach(btn => btn.style.pointerEvents = 'none');
  
  document.getElementById('submit-btn').style.display = 'none';
  document.getElementById('next-btn').style.display = 'block';
}

function nextQuestion() {
  currentIndex++;
  if (currentIndex < questions.length) {
    renderQuestion();
  } else {
    showResults();
  }
}

function showResults() {
  switchScreen('result-screen');
  document.getElementById('final-score').innerText = `${score} / ${questions.length}`;
  const msg = document.getElementById('score-message');
  const ratio = score / questions.length;
  if (ratio === 1) msg.innerText = "完璧です！素晴らしい！";
  else if (ratio >= 0.8) msg.innerText = "大変よくできました！";
  else if (ratio >= 0.5) msg.innerText = "その調子！さらに復習しましょう。";
  else msg.innerText = "基礎からしっかり見直してみましょう。";
}
</script>
