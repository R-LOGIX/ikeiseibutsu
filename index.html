<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>医系生物 - 総合学習メニュー</title>
    <link rel="icon" href="icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <style>
        :root {
            --bg-color: #0a0f1d;
            --card-bg: #131a30;
            --text-color: #e2e8f0;
            --accent-color: #00f2fe;
            --bio-color: #00e676;
            --border-color: #222f54;
            --warning-color: #ffd54f;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(0, 242, 254, 0.05), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(0, 230, 118, 0.05), transparent 25%);
        }

        .container {
            width: 100%;
            max-width: 800px;
            background: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 8px 32px 0 rgba(0, 242, 254, 0.15);
            border: 1px solid var(--border-color);
            padding: 40px 30px;
            text-align: center;
            animation: fadeIn 0.6s ease forwards;
            position: relative;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 👑 オリジナル生成アイコンのスタイル */
        .hero-icon-wrapper {
            margin: 0 auto 20px auto;
            width: 140px;
            height: 140px;
            animation: float 4s ease-in-out infinite;
        }

        @keyframes float {
            0% { transform: translateY(0px) drop-shadow(0 0 10px rgba(0, 242, 254, 0.3)); }
            50% { transform: translateY(-10px) drop-shadow(0 0 25px rgba(0, 230, 118, 0.5)); }
            100% { transform: translateY(0px) drop-shadow(0 0 10px rgba(0, 242, 254, 0.3)); }
        }

        h1 {
            font-size: 2.2rem;
            margin-bottom: 10px;
            color: #fff;
            text-shadow: 0 0 12px var(--accent-color);
            letter-spacing: 2px;
        }

        .subtitle {
            color: #94a3b8;
            font-size: 1.1rem;
            margin-bottom: 20px;
            line-height: 1.6;
        }

        /* 注意書きパネルのデザイン */
        .warning-note {
            display: inline-block;
            color: var(--warning-color);
            background: rgba(255, 213, 79, 0.1);
            border: 1px solid rgba(255, 213, 79, 0.3);
            padding: 8px 20px;
            border-radius: 8px;
            font-size: 0.95rem;
            margin-bottom: 35px;
            letter-spacing: 1px;
            box-shadow: 0 2px 10px rgba(255, 213, 79, 0.05);
        }

        /* メニューのグリッドレイアウト */
        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
        }

        /* 選択カードのデザイン */
        .menu-card {
            background: rgba(34, 47, 84, 0.4);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 35px 20px;
            text-decoration: none;
            color: var(--text-color);
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        /* カードのホバー（マウスオーバー）エフェクト */
        .menu-card:hover {
            background: rgba(0, 242, 254, 0.08);
            border-color: var(--accent-color);
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0, 242, 254, 0.2);
        }

        .menu-card::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 50%; height: 100%;
            background: linear-gradient(to right, transparent, rgba(0, 242, 254, 0.1), transparent);
            transform: skewX(-25deg);
            transition: all 0.5s;
        }

        .menu-card:hover::before {
            left: 150%;
        }

        .card-icon {
            font-size: 3rem;
            margin-bottom: 15px;
            filter: drop-shadow(0 0 8px rgba(0, 242, 254, 0.5));
        }

        .card-title {
            font-size: 1.4rem;
            color: var(--accent-color);
            margin-bottom: 15px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .card-desc {
            font-size: 0.95rem;
            color: #94a3b8;
            line-height: 1.6;
        }

        .badge {
            background: var(--accent-color);
            color: #000;
            font-size: 0.75rem;
            font-weight: bold;
            padding: 4px 10px;
            border-radius: 20px;
            position: absolute;
            top: 15px;
            right: 15px;
            box-shadow: 0 0 10px var(--accent-color);
        }

    </style>
</head>
<body>

<div class="container">
    
    <div class="hero-icon-wrapper">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
            <defs>
                <linearGradient id="cyberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#00f2fe" />
                    <stop offset="100%" stop-color="#4facfe" />
                </linearGradient>
                <linearGradient id="bioGrad" x1="0%" y1="100%" x2="100%" y2="0%">
                    <stop offset="0%" stop-color="#00e676" />
                    <stop offset="100%" stop-color="#00f2fe" />
                </linearGradient>
                <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
                    <feGaussianBlur stdDeviation="6" result="blur" />
                    <feComposite in="SourceGraphic" in2="blur" operator="over" />
                </filter>
            </defs>

            <circle cx="100" cy="100" r="90" fill="none" stroke="url(#cyberGrad)" stroke-width="2" stroke-dasharray="15 10" opacity="0.6">
                <animateTransform attributeName="transform" type="rotate" from="0 100 100" to="360 100 100" dur="20s" repeatCount="indefinite" />
            </circle>
            <circle cx="100" cy="100" r="80" fill="none" stroke="rgba(0,242,254,0.3)" stroke-width="1" />

            <path d="M 85 40 h 30 v 45 h 45 v 30 h -45 v 45 h -30 v -45 h -45 v -30 h 45 z" fill="rgba(0, 230, 118, 0.1)" stroke="url(#bioGrad)" stroke-width="3" filter="url(#glow)"/>

            <path d="M 75 50 C 145 80, 145 120, 75 150" fill="none" stroke="url(#cyberGrad)" stroke-width="6" stroke-linecap="round" filter="url(#glow)"/>
            <path d="M 125 50 C 55 80, 55 120, 125 150" fill="none" stroke="url(#bioGrad)" stroke-width="6" stroke-linecap="round" filter="url(#glow)"/>
            
            <line x1="88" y1="65" x2="112" y2="65" stroke="rgba(255,255,255,0.7)" stroke-width="3" stroke-linecap="round"/>
            <line x1="97" y1="85" x2="103" y2="85" stroke="rgba(255,255,255,0.7)" stroke-width="3" stroke-linecap="round"/>
            <line x1="97" y1="115" x2="103" y2="115" stroke="rgba(255,255,255,0.7)" stroke-width="3" stroke-linecap="round"/>
            <line x1="88" y1="135" x2="112" y2="135" stroke="rgba(255,255,255,0.7)" stroke-width="3" stroke-linecap="round"/>

            <circle cx="65" cy="55" r="4" fill="#00e676" filter="url(#glow)">
                <animate attributeName="cy" values="55;50;55" dur="3s" repeatCount="indefinite"/>
            </circle>
            <circle cx="145" cy="135" r="5" fill="#00f2fe" filter="url(#glow)">
                <animate attributeName="cy" values="135;142;135" dur="4s" repeatCount="indefinite"/>
            </circle>
        </svg>
    </div>

    <h1>医系生物<br><span style="font-size:1.4rem; color:var(--accent-color);">総合学習システム</span></h1>
    <p class="subtitle">学習を開始するモードを選択してください。</p>
    
    <div class="warning-note">
        ※論述問題や計算問題は収録していません
    </div>

    <div class="menu-grid">
        <a href="index.html" class="menu-card" data-target="index.html">
            <div class="badge">1問1答形式</div>
            <div class="card-icon">🔠</div>
            <div class="card-title">選択式問題 10年分</div>
            <div class="card-desc">
                ランダム出題対応。<br>特殊形式も含めた全31問を<br>スピーディーに演習します。
            </div>
        </a>

        <a href="index2.html" class="menu-card" data-target="index2.html">
            <div class="badge">記述・長文形式</div>
            <div class="card-icon">📝</div>
            <div class="card-title">空欄補充問題 10年分</div>
            <div class="card-desc">
                自動正誤判定システム搭載。<br>テキスト入力で本格的な<br>知識の定着を図ります。
            </div>
        </a>
    </div>
</div>

<script>
    // --- 効果音システム (Web Audio API) ---
    let audioCtx = null;

    function initAudio() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
    }

    function playBootSound() {
        if (!audioCtx) return;
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        
        // システム起動・決定音
        osc.type = 'sine';
        osc.frequency.setValueAtTime(880, now); 
        osc.frequency.exponentialRampToValueAtTime(1760, now + 0.15); 
        
        gain.gain.setValueAtTime(0, now);
        gain.gain.linearRampToValueAtTime(0.15, now + 0.05);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
        
        osc.start(now);
        osc.stop(now + 0.3);
    }

    // 画面クリックでオーディオを初期化
    document.body.addEventListener('click', () => {
        initAudio();
    }, { once: true });
    document.body.addEventListener('touchstart', () => {
        initAudio();
    }, { once: true });

    // リンク遷移時のアニメーション＆サウンド処理
    document.querySelectorAll('.menu-card').forEach(card => {
        card.addEventListener('click', function(e) {
            e.preventDefault(); 
            
            initAudio();
            playBootSound(); 

            // クリックしたカードを光らせるエフェクト
            this.style.transform = 'scale(0.95)';
            this.style.boxShadow = '0 0 30px #00f2fe';
            this.style.background = 'rgba(0, 242, 254, 0.2)';

            const targetUrl = this.getAttribute('data-target');
            setTimeout(() => {
                window.location.href = targetUrl;
            }, 350);
        });
    });
</script>

</body>
</html>
