<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>医系生物（選択式問題）</title>
    <style>
        :root {
            --bg-main: #0a0f1d;
            --bg-card: #131c32;
            --primary: #00f2fe;
            --primary-glow: rgba(0, 242, 254, 0.2);
            --accent: #9d4edd;
            --text-main: #e2e8f0;
            --text-muted: #94a3b8;
            --correct: #10b981;
            --incorrect: #ef4444;
            --border: #223154;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem 1rem;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background: var(--bg-card);
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), 0 0 40px var(--primary-glow);
            border: 1px solid var(--border);
            padding: 2rem;
            transition: all 0.3s ease;
        }

        header {
            text-align: center;
            margin-bottom: 2rem;
            border-bottom: 2px solid var(--border);
            padding-bottom: 1.5rem;
        }

        h1 {
            font-size: 2rem;
            color: var(--primary);
            text-shadow: 0 0 10px var(--primary-glow);
            margin-bottom: 0.5rem;
            letter-spacing: 1px;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .settings-panel {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 8px;
            padding: 1rem;
            margin-bottom: 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid var(--border);
        }

        .switch-container {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            cursor: pointer;
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 50px;
            height: 26px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #334155;
            transition: .4s;
            border-radius: 34px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 4px;
            bottom: 4px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: var(--primary);
        }

        input:checked + .slider:before {
            transform: translateX(24px);
        }

        .btn {
            background: linear-gradient(135deg, var(--primary), var(--accent));
            color: #000;
            font-weight: bold;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 15px rgba(0, 242, 254, 0.3);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 242, 254, 0.5);
        }

        .btn:disabled {
            background: #475569;
            color: #94a3b8;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .progress-bar-container {
            width: 100%;
            height: 8px;
            background-color: #1e293b;
            border-radius: 4px;
            margin-bottom: 2rem;
            overflow: hidden;
            display: none;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--primary), var(--accent));
            transition: width 0.3s ease;
        }

        .quiz-screen {
            display: none;
        }

        .question-header {
            font-size: 1.2rem;
            margin-bottom: 1.5rem;
            color: #fff;
            line-height: 1.6;
        }

        .options-container {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .option-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 1rem 1.25rem;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .option-card:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: var(--primary);
        }

        .option-card.selected {
            background: rgba(0, 242, 254, 0.08);
            border-color: var(--primary);
            box-shadow: 0 0 10px rgba(0, 242, 254, 0.2);
        }

        .option-card input[type="radio"], 
        .option-card input[type="checkbox"] {
            accent-color: var(--primary);
            width: 18px;
            height: 18px;
        }

        /* 特殊形式（マトリクス型）のスタイル */
        .matrix-row {
            background: rgba(255, 255, 255, 0.01);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 1rem;
            margin-bottom: 1rem;
        }
        .matrix-label {
            margin-bottom: 0.5rem;
            font-weight: bold;
            color: var(--primary);
        }
        .matrix-options {
            display: flex;
            gap: 1.5rem;
            flex-wrap: wrap;
        }
        .matrix-opt {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            cursor: pointer;
        }

        .result-screen {
            display: none;
            text-align: center;
        }

        .score-display {
            font-size: 3rem;
            font-weight: bold;
            color: var(--primary);
            margin: 1.5rem 0;
            text-shadow: 0 0 20px var(--primary-glow);
        }

        .review-container {
            margin-top: 2.5rem;
            text-align: left;
            max-height: 50vh;
            overflow-y: auto;
            padding-right: 0.5rem;
        }

        .review-item {
            background: rgba(255, 255, 255, 0.02);
            border-left: 4px solid #fff;
            padding: 1rem;
            margin-bottom: 1rem;
            border-radius: 0 8px 8px 0;
        }

        .review-item.correct { border-left-color: var(--correct); }
        .review-item.incorrect { border-left-color: var(--incorrect); }

        .review-q { font-weight: bold; margin-bottom: 0.5rem; }
        .review-ans { font-size: 0.9rem; color: var(--text-muted); }
        .status-badge {
            display: inline-block;
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: bold;
            margin-bottom: 0.5rem;
        }
        .status-badge.correct { background: rgba(16, 185, 129, 0.2); color: var(--correct); }
        .status-badge.incorrect { background: rgba(239, 68, 68, 0.2); color: var(--incorrect); }

        /* スクロールバーのカスタマイズ */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.1); }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--primary); }

        .footer-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 1.5rem;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>医系生物（選択式問題）</h1>
        <p class="subtitle">全36問の専門的な演習クイズ</p>
    </header>

    <div id="start-screen">
        <div class="settings-panel">
            <label class="switch-container">
                <div class="switch">
                    <input type="checkbox" id="shuffle-toggle" checked>
                    <span class="slider"></span>
                </div>
                <span>問題をランダムにシャッフルする</span>
            </label>
            <button class="btn" onclick="startQuiz()">クイズを開始</button>
        </div>
        <div style="text-align: center; color: var(--text-muted); line-height: 1.8;">
            <p>医系生物(小代田担当分)の選択式問題10年分を網羅しています。</p>
            <p>選択肢の順番はそのままに、問題の出題順のみをランダム化できます。</p>
        </div>
    </div>

    <div class="progress-bar-container" id="progress-container">
        <div class="progress-bar" id="progress-bar"></div>
    </div>

    <div id="quiz-screen" class="quiz-screen">
        <div class="question-header" id="question-text"></div>
        <div class="options-container" id="options-box"></div>
        <div class="footer-actions">
            <span id="question-counter" style="color: var(--text-muted);"></span>
            <button class="btn" id="next-btn" onclick="submitAnswer()">回答を確定</button>
        </div>
    </div>

    <div id="result-screen" class="result-screen">
        <h2>演習完了</h2>
        <div class="score-display" id="score-text">0 / 0</div>
        <p id="evaluation-text" style="margin-bottom: 1.5rem; font-size: 1.1rem;"></p>
        <button class="btn" onclick="resetQuiz()">最初から解き直す</button>

        <div class="review-container" id="review-box">
            <h3>解答レビュー</h3>
            </div>
    </div>
</div>

<script>
    // 全36問の問題データ定義
    const rawQuestions = [
        {
            id: "問５",
            type: "single",
            question: "問５　直接のエネルギー供給が必要なのはどれか。",
            options: ["（A）拡散", "（B）能動輸送", "（C）浸透", "（D）受動輸送"],
            answer: 1 // B
        },
        {
            id: "問６",
            type: "single",
            question: "問６　水は細胞が次のどの液にあるときに外へ出て行くか。",
            options: ["（A）低張液", "（B）等張液", "（C）高張液", "（D）上のどれでもない"],
            answer: 2 // C
        },
        {
            id: "問７",
            type: "single",
            question: "問７　細胞が低張液の中にあるとき、水は細胞に対してどのように動くか。",
            options: ["（A）細胞の外へ出ていく", "（B）細胞の中へ入っていく", "（C）細胞膜を通らない", "（D）上のどれでもない"],
            answer: 1 // B
        },
        {
            id: "問８",
            type: "single",
            question: "問８　酸化的リン酸化においてATP合成酵素によるATP合成の直接のエネルギー源は次のうちどれか。",
            options: [
                "（A）グルコースと他の有機化合物の酸化",
                "（B）電子伝達系を下る電子の流れ",
                "（C）ATP合成酵素をもつ膜を介したH⁺濃度勾配",
                "（D）リン酸のADPへの転移"
            ],
            answer: 2 // C
        },
        {
            id: "問１０",
            type: "single",
            question: "問１０　ミトコンドリアの電子伝達鎖に電子が流れる時、次のどれが起こるか。",
            options: [
                "（A）ミトコンドリアマトリックスのpHが上昇する。",
                "（B）ATP合成酵素が能動輸送によってプロトンを輸送する。",
                "（C）電子が自由エネルギーを獲得する。",
                "（D）NAD⁺が酸化される。"
            ],
            answer: 0 // A
        },
        {
            id: "問１３",
            type: "single",
            question: "問１３　細胞膜のNa⁺/K⁺-ATPaseによるATP加水分解を促進する薬剤を摂取すれば、次のどの現象が起こるか。",
            options: [
                "（A）ミトコンドリア内膜のpH勾配は増加する。",
                "（B）ミトコンドリアのNADHをNAD⁺に酸化する速度は低下する。",
                "（C）発熱が減少する。",
                "（D）O₂に電子を伝達する速度は増加する。"
            ],
            answer: 3 // D
        },
        {
            id: "問１５",
            type: "single",
            question: "問１５　次のうち、間違っているのはどれか。",
            options: [
                "（A）好気性生物は必要なATPの大部分を解糖系でつくる。",
                "（B）解糖系でピルビン酸がつくられ、クエン酸回路でピルビン酸が消費される。",
                "（C）解糖系は細胞質（細胞質基質）で進行する。",
                "（D）解糖系は細胞呼吸の最初の段階となる。"
            ],
            answer: 0 // A
        },
        {
            id: "問１６",
            type: "matrix",
            question: "問１６　次の記述の正誤を判断せよ。",
            subQuestions: [
                { label: "（A）嫌気性生物は必要なATPを解糖系でつくる。", options: ["〇", "×"], answer: 0 },
                { label: "（B）解糖系でクエン酸がつくられ、クエン酸回路で消費される。", options: ["〇", "×"], answer: 1 },
                { label: "（C）解糖系は細胞質（細胞質基質）で進行する。", options: ["〇", "×"], answer: 0 },
                { label: "（D）解糖系は細胞呼吸の最初の段階となる。", options: ["〇", "×"], answer: 0 }
            ]
        },
        {
            id: "問２０",
            type: "single",
            question: "問２０　クエン酸回路の主要な機能はどれか。",
            options: [
                "（A）CO₂を発生すること",
                "（B）アセチル-CoAのアセチル基の電子をNAD⁺とFADに渡すこと",
                "（C）アセチル-CoAのアセチル部分をオキサロ酢酸に酸化すること",
                "（D）アセチル-CoAのアセチル部分を酸化して熱を発生すること",
                "（E）過剰のピルビン酸と脂肪酸を処理すること"
            ],
            answer: 1 // B
        },
        {
            id: "問２１",
            type: "matrix",
            question: "問２１　ファンデルワールス力と水素結合の2種類の結合のうち、（１）～（３）の部分にできるのはどちらか。記号で答えよ。<br><small>（A）ファンデルワールス力　（B）水素結合　（C）ファンデルワールス力と水素結合の両方</small>",
            subQuestions: [
                { label: "（１）炭素に結合した水素原子どうしの間", options: ["（A）", "（B）", "（C）"], answer: 0 },
                { label: "（２）窒素原子と、炭素に結合した水素原子との間", options: ["（A）", "（B）", "（C）"], answer: 0 },
                { label: "（３）窒素原子と、酸素に結合した水素原子との間", options: ["（A）", "（B）", "（C）"], answer: 2 }
            ]
        },
        {
            id: "問22",
            type: "single",
            question: "問22　次の生物のうち、膜の不飽和リン脂質の割合が最も高いと思われるのはどれか。",
            options: ["A) 南極海の魚", "B) 砂漠のヘビ", "C) 人類", "D) ホッキョクグマ", "E) 100℃の温泉に住む好熱性細菌"],
            answer: 0 // A
        },
        {
            id: "問２３",
            type: "matrix",
            question: "問２３　次の文章中の｛｝の部分について正しいものを選べ。",
            subQuestions: [
                { label: "１．基質濃度［S］がKₘよりもはるかに小さいとき、酵素のほとんどの活性部位に基質が：", options: ["｛（A）結合している｝", "｛（B）結合していない｝"], answer: 1 },
                { label: "２．基質濃度［S］がKₘよりもはるかに大きいときは、反応速度は：", options: ["｛（A）酵素濃度｝によって制限される", "｛（B）基質濃度｝によって制限される"], answer: 0 }

        },
        {
            id: "問２４",
            type: "single",

            options: [
                "（A）Vₘₐₓを増加させるが、Kₘを変えない。",
                "（B）Vₘₐₓを減少させるが、Kₘを変えない。",
                "（C）Kₘを増加させるが、Vₘₐₓを変えない。",
                "（D）Kₘを減少させるが、Vₘₐₓを変えない。",
                "（E）Vₘₐₓ、Kₘともに減少させる。"
            ],
            answer: 2 // C
        },
        {
            id: "問２５",
            type: "matrix",
            question: "問２５　以下の文章の続きとして正しいものを選べ。",
            subQuestions: [
                { 
                    label: "１．酵素の活性部位は：", 
                    options: [
                        "（A）特異的基質が加えられた時のみ、形成される。",
                        "（B）アロステリック阻害剤の結合に直接関与する。",
                        "（C）ポリペプチド鎖の一次構造で隣り合ういくつかのアミノ酸残基に存在する。",
                        "（D）競合阻害剤と結合する。"
                    ], 
                    answer: 3 
                },
                { 
                    label: "２．酵素触媒反応の速度（v）は：", 
                    options: [
                        "（A）基質濃度が増加すると減少する。",
                        "（B）酵素が基質で飽和されたときに最も低い。",

                    ], 
                    answer: 2 
                }

        },

            id: "問２６",
            type: "single",
            question: "問２６　反応 E + S ⇄ ES → E + P を触媒する酵素反応に2mM of 基質を加える。初期反応速度はVₘₐₓの20%である。この酵素のKₘはどれか。酵素反応速度はミカエリス・メンテン式 v＝Vₘₐₓ［S］/（Kₘ＋［S］）で与えられる。",

            answer: 2 // C
        },
        {
            id: "問２８",
            type: "matrix",
            question: "問２８　もし多量のジニトロフェノール（DNP）を服用すれば彼女のミトコンドリアで何が起こるか。次の記述について正誤（○・×）を判定せよ。",

            options: [

        },
        {

            type: "multiple",
            question: "問３１　細胞が行う過程で、ヒトが呼吸で吐き出す二酸化炭素が生じる過程はどの過程か。<strong>2つ選べ。</strong>",

        {
            id: "問３３",

        {
            id: "問３４",

            answer: 0 // A
        },
        {

            options: ["（A）5’-UCGGUUAA-3’", "（B）5’-AAUUGGCU-3’", "（C）5’-AGCCAAUU-3’", "（D）5’-UUAACCGA-3’"],

    let currentQuestions = [];
    let currentIndex = 0;
    let score = 0;
    let userAnswers = [];

    function shuffleArray(array) {
        let shuffled = [...array];
        for (let i = shuffled.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
        }
        return shuffled;
    }

    function startQuiz() {
        const isShuffle = document.getElementById('shuffle-toggle').checked;
        currentQuestions = isShuffle ? shuffleArray(rawQuestions) : [...rawQuestions];
        currentIndex = 0;
        score = 0;
        userAnswers = [];

        document.getElementById('start-screen').style.display = 'none';
        document.getElementById('quiz-screen').style.display = 'block';
        document.getElementById('progress-container').style.display = 'block';

        showQuestion();
    }

    function showQuestion() {
        const q = currentQuestions[currentIndex];
        document.getElementById('question-counter').innerText = `問題 ${currentIndex + 1} / ${currentQuestions.length} (${q.id})`;
        document.getElementById('question-text').innerHTML = q.question;
        
        // 進捗バーの更新
        const progressPercent = (currentIndex / currentQuestions.length) * 100;
        document.getElementById('progress-bar').style.width = `${progressPercent}%`;

        const optionsBox = document.getElementById('options-box');
        optionsBox.innerHTML = '';

        if (q.type === 'single') {
            q.options.forEach((opt, idx) => {
                const card = document.createElement('div');
                card.className = 'option-card';
                card.onclick = () => selectSingle(idx);
                card.innerHTML = `<input type="radio" name="quiz-opt" id="opt-${idx}"> <label for="opt-${idx}" style="cursor:pointer; width:100%;">${opt}</label>`;
                optionsBox.appendChild(card);
            });
        } else if (q.type === 'multiple') {
            q.options.forEach((opt, idx) => {
                const card = document.createElement('div');
                card.className = 'option-card';
                card.onclick = () => toggleMultiple(card, idx);
                card.innerHTML = `<input type="checkbox" name="quiz-opt" id="opt-${idx}" onclick="event.stopPropagation();"> <label for="opt-${idx}" style="cursor:pointer; width:100%;">${opt}</label>`;
                optionsBox.appendChild(card);
            });
        } else if (q.type === 'matrix') {
            q.subQuestions.forEach((sub, subIdx) => {
                const row = document.createElement('div');
                row.className = 'matrix-row';
                
                let optHtml = '';
                sub.options.forEach((opt, optIdx) => {
                    optHtml += `
                        <label class="matrix-opt">
                            <input type="radio" name="matrix-${currentIndex}-${subIdx}" value="${optIdx}">
                            <span>${opt}</span>
                        </label>
                    `;
                });

                row.innerHTML = `
                    <div class="matrix-label">${sub.label}</div>
                    <div class="matrix-options">${optHtml}</div>
                `;
                optionsBox.appendChild(row);
            });
        }
    }

    function selectSingle(idx) {
        const cards = document.querySelectorAll('.option-card');
        cards.forEach((c, i) => {
            if(i === idx) {
                c.classList.add('selected');
                c.querySelector('input').checked = true;
            } else {
                c.classList.remove('selected');
            }
        });
    }

    function toggleMultiple(card, idx) {
        const chk = card.querySelector('input');
        chk.checked = !chk.checked;
        if(chk.checked) {
            card.classList.add('selected');
        } else {
            card.classList.remove('selected');
        }
    }

    function submitAnswer() {
        const q = currentQuestions[currentIndex];
        let answerData = null;
        let isCorrect = false;

        if (q.type === 'single') {
            const selected = document.querySelector('.option-card.selected input');
            if (!selected) { alert('選択肢を選んでください。'); return; }
            const idx = parseInt(selected.id.split('-')[1]);
            answerData = idx;
            isCorrect = (idx === q.answer);
        } else if (q.type === 'multiple') {
            const checkedBoxes = document.querySelectorAll('.option-card input:checked');
            if (checkedBoxes.length === 0) { alert('少なくとも1つの選択肢を選んでください。'); return; }
            const idxs = Array.from(checkedBoxes).map(cb => parseInt(cb.id.split('-')[1]));
            answerData = idxs;
            
            // 配列の一致確認
            isCorrect = idxs.length === q.answers.length && idxs.every(v => q.answers.includes(v));
        } else if (q.type === 'matrix') {
            const answers = [];
            let allSelected = true;
            q.subQuestions.forEach((sub, subIdx) => {
                const checked = document.querySelector(`input[name="matrix-${currentIndex}-${subIdx}"]:checked`);
                if(!checked) { allSelected = false; }
                else { answers.push(parseInt(checked.value)); }
            });

            if (!allSelected) { alert('すべての項目の回答を選択してください。'); return; }
            answerData = answers;
            isCorrect = answers.every((ans, sIdx) => ans === q.subQuestions[sIdx].answer);
        }

        if(isCorrect) score++;
        userAnswers.push({ question: q, userAns: answerData, isCorrect: isCorrect });

        currentIndex++;
        if (currentIndex < currentQuestions.length) {
            showQuestion();
        } else {
            showResults();
        }
    }

    function showResults() {
        document.getElementById('quiz-screen').style.display = 'none';
        document.getElementById('progress-container').style.display = 'none';
        document.getElementById('result-screen').style.display = 'block';

        document.getElementById('score-text').innerText = `${score} / ${currentQuestions.length}`;
        
        const percent = (score / currentQuestions.length) * 100;
        let evalText = "";
        if(percent === 100) evalText = "素晴らしい！パーフェクトです！医系生物学のマスターですね。";
        else if(percent >= 80) evalText = "優秀な成績です！合格水準を十分に満たしています。";
        else if(percent >= 60) evalText = "基本は押さえられています。間違えた箇所を復習しましょう。";
        else evalText = "もう一度教科書やノートを読み直して、再度チャレンジしてみましょう！";
        
        document.getElementById('evaluation-text').innerText = evalText;

        const reviewBox = document.getElementById('review-box');
        // 既存のレビューアイテムをリセット（タイトル以外）
        while (reviewBox.childNodes.length > 2) {
            reviewBox.removeChild(reviewBox.lastChild);
        }

        userAnswers.forEach((item, idx) => {
            const div = document.createElement('div');
            div.className = `review-item ${item.isCorrect ? 'correct' : 'incorrect'}`;
            
            let displayAns = "";
            if(item.question.type === 'single') {
                displayAns = `あなたの回答: ${item.question.options[item.userAns]} / 正解: ${item.question.options[item.question.answer]}`;
            } else if (item.question.type === 'multiple') {
                const uStr = item.userAns.map(i => item.question.options[i]).join(', ');
                const cStr = item.question.answers.map(i => item.question.options[i]).join(', ');
                displayAns = `あなたの回答: [${uStr}] / 正解: [${cStr}]`;
            } else if (item.question.type === 'matrix') {
                displayAns = "各項目の結果:<br>";
                item.question.subQuestions.forEach((sub, sIdx) => {
                    const uOpt = sub.options[item.userAns[sIdx]];
                    const cOpt = sub.options[sub.answer];
                    displayAns += `・${sub.label} ➔ あなた: ${uOpt} (正解: ${cOpt})<br>`;
                });
            }

            div.innerHTML = `
                <div class="status-badge ${item.isCorrect ? 'correct' : 'incorrect'}">${item.isCorrect ? '正解' : '不正解'}</div>
                <div class="review-q">${idx + 1}. ${item.question.question}</div>
                <div class="review-ans">${displayAns}</div>
            `;
            reviewBox.appendChild(div);
        });
    }

    function resetQuiz() {
        document.getElementById('result-screen').style.display = 'none';
        document.getElementById('start-screen').style.display = 'block';
    }
</script>
