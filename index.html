<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>医系生物(選択式問題10年分)</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --card-border: rgba(255, 255, 255, 0.1);
            --text-main: #f8fafc;
            --text-sub: #cbd5e1;
            --accent-color: #0ea5e9;
            --accent-hover: #0284c7;
            --success-color: #10b981;
        }

        body {
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at 10% 20%, rgb(14, 26, 64) 0%, rgb(15, 23, 42) 90%);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            width: 100%;
            padding: 2rem 1rem;
            text-align: center;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--card-border);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        h1 {
            margin: 0 0 1rem 0;
            font-size: 1.8rem;
            letter-spacing: 2px;
            color: #38bdf8;
            text-shadow: 0 0 10px rgba(56, 189, 248, 0.3);
        }

        .shuffle-btn {
            background: var(--accent-color);
            color: white;
            border: none;
            padding: 10px 24px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(14, 165, 233, 0.4);
        }

        .shuffle-btn:hover {
            background: var(--accent-hover);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(14, 165, 233, 0.6);
        }

        .shuffle-btn:active {
            transform: translateY(1px);
        }

        #quiz-container {
            width: 100%;
            max-width: 800px;
            padding: 2rem 1rem;
            box-sizing: border-box;
        }

        .question-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            backdrop-filter: blur(12px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            animation: fadeIn 0.5s ease forwards;
            opacity: 0;
        }

        .question-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.3);
            border-color: rgba(56, 189, 248, 0.3);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .q-header {
            display: flex;
            align-items: center;
            margin-bottom: 1rem;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 0.8rem;
        }

        .q-number {
            background: var(--accent-color);
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.9rem;
            margin-right: 12px;
        }

        .q-text {
            font-size: 1.05rem;
            line-height: 1.8;
            color: var(--text-main);
            margin-bottom: 1.5rem;
        }

        .q-text div.options {
            margin-top: 10px;
            padding-left: 10px;
            color: var(--text-sub);
        }

        .action-area {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            margin-top: 1rem;
        }

        .show-answer-btn {
            background: transparent;
            color: var(--accent-color);
            border: 2px solid var(--accent-color);
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .show-answer-btn:hover {
            background: rgba(14, 165, 233, 0.1);
        }

        .answer-area {
            display: none;
            margin-top: 1.5rem;
            padding: 1rem;
            background: rgba(16, 185, 129, 0.1);
            border-left: 4px solid var(--success-color);
            border-radius: 0 8px 8px 0;
            color: #34d399;
            font-weight: bold;
            font-size: 1.2rem;
            animation: slideDown 0.3s ease;
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 印刷や小さい画面用の調整 */
        @media (max-width: 600px) {
            .question-card { padding: 1rem; }
            .q-text { font-size: 0.95rem; }
        }
    </style>
</head>
<body>

    <header>
        <h1>医系生物(選択式問題10年分)</h1>
        <button id="randomize-btn" class="shuffle-btn">問題をシャッフルする</button>
    </header>

    <main id="quiz-container"></main>

    <script>
        const rawData = [
            { num: "問５", text: "直接のエネルギー供給が必要なのはどれか。<br><div class='options'>（A）拡散<br>（B）能動輸送<br>（C）浸透<br>（D）受動輸送</div>", ans: "B" },
            { num: "問６", text: "水は細胞が次のどの液にあるときに外へ出て行くか。<br><div class='options'>（A）低張液<br>（B）等張液<br>（C）高張液<br>（D）上のどれでもない</div>", ans: "C" },
            { num: "問７", text: "細胞が低張液の中にあるとき、水は細胞に対してどのように動くか。<br><div class='options'>（A）細胞の外へ出ていく<br>（B）細胞の中へ入っていく<br>（C）細胞膜を通らない<br>（D）上のどれでもない</div>", ans: "B" },
            { num: "問８", text: "酸化的リン酸化においてATP合成酵素によるATP合成の直接のエネルギー源は次のうちどれか。<br><div class='options'>（A）グルコースと他の有機化合物の酸化<br>（B）電子伝達系を下る電子の流れ<br>（C）ATP合成酵素をもつ膜を介したH⁺濃度勾配<br>（D）リン酸のADPへの転移</div>", ans: "C" },
            { num: "問１０", text: "ミトコンドリアの電子伝達鎖に電子が流れる時、次のどれが起こるか。<br><div class='options'>（A）ミトコンドリアマトリックスのpHが上昇する。<br>（B）ATP合成酵素が能動輸送によってプロトンを輸送する。<br>（C）電子が自由エネルギーを獲得する。<br>（D）NAD⁺が酸化される。</div>", ans: "A" },
            { num: "問１３", text: "細胞膜のNa⁺/K⁺-ATPaseによるATP加水分解を促進する薬剤を摂取すれば、次のどの現象が起こるか。<br><div class='options'>（A）ミトコンドリア内膜のpH勾配は増加する。<br>（B）ミトコンドリアのNADHをNAD⁺に酸化する速度は低下する。<br>（C）発熱が減少する。<br>（D）O₂に電子を伝達する速度は増加する。</div>", ans: "D" },
            { num: "問１５", text: "次のうち、間違っているのはどれか。<br><div class='options'>（A）好気性生物は必要なATPの大部分を解糖系でつくる。<br>（B）解糖系でピルビン酸がつくられ、クエン酸回路でピルビン酸が消費される。<br>（C）解糖系は細胞質（細胞質基質）で進行する。<br>（D）解糖系は細胞呼吸の最初の段階となる。</div>", ans: "A" },
            { num: "問１６", text: "次の記述の正誤を判断せよ。<br><div class='options'>（A）嫌気性生物は必要なATPを解糖系でつくる。<br>（B）解糖系でクエン酸がつくられ、クエン酸回路で消費される。<br>（C）解糖系は細胞質（細胞質基質）で進行する。<br>（D）解糖系は細胞呼吸の最初の段階となる。</div>", ans: "〇×〇〇" },
            { num: "問２０", text: "クエン酸回路の主要な機能はどれか。<br><div class='options'>（A）CO₂を発生すること<br>（B）アセチル-CoAのアセチル基の電子をNAD⁺とFADに渡すこと<br>（C）アセチル-CoAのアセチル部分をオキサロ酢酸に酸化すること<br>（D）アセチル-CoAのアセチル部分を酸化して熱を発生すること<br>（E）過剰のピルビン酸と脂肪酸を処理すること</div>", ans: "B" },
            { num: "問２１", text: "ファンデルワールス力と水素結合の2種類の結合のうち、（１）～（３）の部分にできるのはどちらか。記号で答えよ。<br>（A）ファンデルワールス力　　（B）水素結合　　（C）ファンデルワールス力と水素結合の両方<br><div class='options'>（１）炭素に結合した水素原子どうしの間<br>（２）窒素原子と、炭素に結合した水素原子との間<br>（３）窒素原子と、酸素に結合した水素原子との間</div>", ans: "AAC" },
            { num: "問２２", text: "次の生物のうち、膜の不飽和リン脂質の割合が最も高いと思われるのはどれか。<br><div class='options'>A) 南極海の魚<br>B) 砂漠のヘビ<br>C) 人類<br>D) ホッキョクグマ<br>E) 100℃の温泉に住む好熱性細菌</div>", ans: "A" },
            { num: "問２３", text: "次の文章中の｛｝の部分について正しいものを選べ。<br>１．基質濃度［S］がKₘよりもはるかに小さいとき、酵素のほとんどの活性部位に基質が｛（A）結合している／（B）結合していない｝。<br>２．基質濃度［S］がKₘよりもはるかに大きいときは、反応速度は｛（A）酵素濃度／（B）基質濃度｝によって制限される。", ans: "BA" },
            { num: "問２４", text: "以下の文章の続きとして正しいものを選べ。また、その理由を説明せよ。<br>酵素の競合阻害剤となる薬剤は、<br><div class='options'>（A）Vₘₐₓを増加させるが、Kₘを変えない。<br>（B）Vₘₐₓを減少させるが、Kₘを変えない。<br>（C）Kₘを増加させるが、Vₘₐₓを変えない。<br>（D）Kₘを減少させるが、Vₘₐₓを変えない。<br>（E）Vₘₐₓ、Kₘともに減少させる。</div>", ans: "C" },
            { num: "問２５", text: "以下の文章の続きとして正しいものを選べ。<br>１．酵素の活性部位は<br><div class='options'>（A）特異的基質が加えられた時のみ、形成される。<br>（B）アロステリック阻害剤の結合に直接関与する。<br>（C）ポリペプチド鎖の一次構造で隣り合ういくつかのアミノ酸残基に存在する。<br>（D）競合阻害剤と結合する。</div><br>２．酵素触媒反応の速度（v）は<br><div class='options'>（A）基質濃度が増加すると減少する。<br>（B）酵素が基質で飽和されたときに最も低い。<br>（C）1/2Vₘₐₓを与える基質濃度の関数である。<br>（D）溶液のpHとは無関係である。</div>", ans: "DC" },
            { num: "問２６", text: "反応 E + S ⇄ ES → E + P を触媒する酵素反応に2mMの基質を加える。初期反応速度はVₘₐₓの20%である。この酵素のKₘはどれか。酵素反応速度はミカエリス・メンテン式<br>v＝Vₘₐₓ［S］/（Kₘ＋［S］）<br>で与えられる。<br><div class='options'>（A）2mM<br>（B）4mM<br>（C）8mM<br>（D）12mM<br>（E）25mM</div>", ans: "C" },
            { num: "問２８", text: "減量希望の化学者がジニトロフェノール（DNP）を入手し、服用前に医師に相談したところ、DNPは脱共役剤で減量のための服用は危険だといわれた。もし多量のDNPを服用すれば彼女のミトコンドリアで何が起こるか。次の記述について、正しいものには○、間違っているものには×を付け、さらに間違いを正しなさい。<br><div class='options'>（A）O₂消費が減少する。<br>（B）CO₂発生が減少する。<br>（C）プロトン濃度勾配が増加する。<br>（D）NADHの酸化速度が増加する。<br>（E）体温が下がる。</div>", ans: "×××〇×" },
            { num: "問３０", text: "次の反応のうち、エネルギー的に起こりやすい反応と共役させたときにだけ起こるのはどれか。3つ選べ。<br><div class='options'>（A）グルコース + O₂ → CO₂ + H₂O<br>（B）CO₂ + H₂O → グルコース + O₂<br>（C）ヌクレオチド塩基 → ヌクレオチド三リン酸<br>（D）ヌクレオチド三リン酸 → DNA<br>（E）ADP + Pᵢ → ATP</div>", ans: "BCE" },
            { num: "問３１", text: "細胞が行う過程で、ヒトが呼吸で吐き出す二酸化炭素が生じる過程はどの過程か。2つ選べ。<br><div class='options'>（A）解糖<br>（B）乳酸発酵<br>（C）ピルビン酸からアセチルCoAへの変換<br>（D）クエン酸回路<br>（E）電子伝達</div>", ans: "CD" },
            { num: "問３２", text: "異化過程に由来するほとんどのCO₂は次のどの過程で放出されるか。<br><div class='options'>（A）解糖<br>（B）クエン酸回路<br>（C）乳酸発酵<br>（D）電子伝達</div>", ans: "B" },
            { num: "問３３", text: "ヒトが呼吸している酸素のほとんどは次のどの過程で消費されるか。<br><div class='options'>（A）解糖<br>（B）乳酸発酵<br>（C）ピルビン酸からアセチルCoAへの変換<br>（D）クエン酸回路<br>（E）電子伝達</div>", ans: "E" },
            { num: "問３４", text: "好気的な酸化的リン酸化で機能する電子伝達鎖の最終的な電子伝達体は、次のうちどれか。<br><div class='options'>（A）酸素<br>（B）水<br>（C）NAD⁺<br>（D）ピルビン酸</div>", ans: "A" },
            { num: "問３５", text: "次の文を正しく完成するように選択肢から1つ選べ。<br>Aとaが同じ遺伝子の異なる対立遺伝子であるとき、Aaの遺伝子型の個体は、<br><div class='options'>（A）ホモ接合体である。<br>（B）ヘテロ接合体である。<br>（C）優性である。<br>（D）劣性である。</div>", ans: "B" },
            { num: "問３８", text: "ある子供がAB型の血液型をもつとすると、その両親についてはどのようなことがいえるか。正しい文を選べ。<br><div class='options'>（A）両親ともヘテロ接合体である。<br>（B）両親ともA型かO型でありうるが、AB型ではない。<br>（C）両親ともAB型である。<br>（D）両親ともO型ではない。</div>", ans: "D" },
            { num: "問４５", text: "二遺伝子雑種交雑のF₂世代（雑種第二代）について正しいのはどれか。<br><div class='options'>（A）もし遺伝子座がつながっていれば、4つの表現型が比率9：3：3：1で現れる。<br>（B）もし遺伝子座がつながっていなければ、4つの表現型が比率9：3：3：1で現れる。<br>（C）もし遺伝子座がつながっていなければ、2つの表現型が比率3：1で現れる。<br>（D）もし遺伝子座がつながっていれば、3つの表現型が比率1：2：1で現れる。</div>", ans: "B" },
            { num: "問４６", text: "連鎖している遺伝子について正しいのはどれか。<br><div class='options'>（A）染色体上で互いに隣接していなければならない。<br>（B）互いに独立して分離される対立遺伝子をもつ。<br>（C）同じ染色体上にある。<br>（D）常に交差する。</div>", ans: "C" },
            { num: "問４７", text: "大腸菌培養による組換えDNAの大量調整を何というか。<br><div class='options'>（A）PCR<br>（B）DNAポリメラーゼ<br>（C）DNAライゲーション<br>（D）DNAクローニング</div>", ans: "D" },
            { num: "問４８", text: "色素性乾皮症の患者が太陽光に露光すると皮膚がんまで進行するが、これは以下の欠損による。<br><div class='options'>（A）複製複合体の酵素プライマーゼ<br>（B）DNAポリメラーゼ<br>（C）ヌクレオチド除去修復酵素<br>（D）ヘリカーゼ</div>", ans: "C" },
            { num: "問４９", text: "色素性乾皮症の患者はUVに露光するとDNA障害を受けるが、これはUV光により、<br><div class='options'>（A）DNA中にリボース三量体ができるから。<br>（B）DNA中にチミン二量体ができるから。<br>（C）DNA中にデオキシリボース二量体ができるから。<br>（D）DNA中のリン酸基間に酸無水物結合ができるから。</div>", ans: "B" },
            { num: "問５０", text: "DNAの複製に関して正しい記述はどれか。<br><div class='options'>（A）細胞周期のM期で行われる。<br>（B）5’から3’方向へコピーするDNA鋳型が必要である。<br>（C）染色体上の複製起点から両方向に進む。<br>（D）新規に合成した1本の二重らせんと2本の親鎖からなる二重らせんをつくる。</div>", ans: "C" },
            { num: "問５１", text: "DNAの複製に関して正しい記述はどれか。<br><div class='options'>（A）細胞周期のM期で行われる。<br>（B）3’から5’方向へコピーするDNA鋳型が必要である。<br>（C）染色体上の複製起点から一方向に進む。<br>（D）新規に合成した1本の二重らせんと2本の親鎖からなる二重らせんをつくる。</div>", ans: "B" },
            { num: "問５２", text: "DNAポリメラーゼ活性に必要なのはどれか。<br><div class='options'>（A）dUTP<br>（B）5’-ヒドロキシ基<br>（C）3’-ヒドロキシ基<br>（D）CTP</div>", ans: "C" },
            { num: "問５３", text: "岡崎フラグメントに関して正しい記述はどれか。<br><div class='options'>（A）複製のときラギング鎖でつくられる。<br>（B）タンパク質のアミノ酸をコードしていないDNA領域である。<br>（C）5’末端に少数のデオキシリボヌクレオチドをもつ比較的短いポリリボヌクレオチドである。<br>（D）選択的スプライシングにより生じる生成物である。</div>", ans: "A" },
            { num: "問５４", text: "DNAを特異的な配列で切断するものはどれか。<br><div class='options'>（A）DNAリガーゼ<br>（B）DNAポリメラーゼ<br>（C）制限酵素<br>（D）ヘリカーゼ</div>", ans: "C" },
            { num: "問５５", text: "遺伝子の両端のDNA配列が判明している場合、数時間で数十億倍に遺伝子を増幅する方法はどれか。<br><div class='options'>（A）PCR<br>（B）DNAポリメラーゼ<br>（C）DNAライゲーション<br>（D）DNAクローニング</div>", ans: "A" },
            { num: "問５７", text: "DNAのリーディング鎖とラギング鎖の複製方法が異なる根本的な理由は次のうちどれか。<br><div class='options'>（A）複製の開始が5’末端のみから起こること。<br>（B）ヘリカーゼと1本鎖結合タンパク質が5’末端で働いていること。<br>（C）DNAポリメラーゼが新たなヌクレオチドを伸長中の鎖の3’末端にしか付加できないこと。<br>（D）DNAリガーゼが3’→5’方向にしか働かないこと。</div>", ans: "C" },
            { num: "問６４", text: "5’-AGCCAATT-3’配列を含むDNAフラグメントを転写の鋳型として使えば、転写されるRNA配列はどれか。<br><div class='options'>（A）5’-UCGGUUAA-3’<br>（B）5’-AAUUGGCU-3’<br>（C）5’-AGCCAAUU-3’<br>（D）5’-UUAACCGA-3’</div>", ans: "B" }
        ];

        let questions = [...rawData];

        // Web Audio API Context (ユーザーアクション後に初期化)
        let audioCtx;
        
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        // 解答表示時の音（ピロリン♪）
        function playRevealSound() {
            initAudio();
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(880, audioCtx.currentTime); // A5
            osc.frequency.exponentialRampToValueAtTime(1760, audioCtx.currentTime + 0.1); // A6
            gainNode.gain.setValueAtTime(0.05, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.3);
        }

        // シャッフル時の音（シュッ！）
        function playShuffleSound() {
            initAudio();
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(600, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(200, audioCtx.currentTime + 0.15);
            gainNode.gain.setValueAtTime(0.05, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.15);
        }

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        function renderQuiz() {
            const container = document.getElementById("quiz-container");
            container.innerHTML = ""; // クリア
            
            questions.forEach((q, index) => {
                const card = document.createElement("div");
                card.className = "question-card";
                card.style.animationDelay = `${index * 0.05}s`;

                card.innerHTML = `
                    <div class="q-header">
                        <span class="q-number">${q.num}</span>
                    </div>
                    <div class="q-text">${q.text}</div>
                    <div class="action-area">
                        <button class="show-answer-btn">解答を表示</button>
                    </div>
                    <div class="answer-area">解答： ${q.ans}</div>
                `;

                // 解答表示ボタンのイベント
                const btn = card.querySelector(".show-answer-btn");
                const ansArea = card.querySelector(".answer-area");
                btn.addEventListener("click", () => {
                    if (ansArea.style.display === "block") return;
                    ansArea.style.display = "block";
                    btn.style.display = "none";
                    playRevealSound();
                });

                container.appendChild(card);
            });
        }

        document.getElementById("randomize-btn").addEventListener("click", () => {
            playShuffleSound();
            shuffleArray(questions);
            renderQuiz();
            
            // スクロールを一番上に戻す
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });

        // 初回描画
        renderQuiz();
    </script>
</body>
</html>
