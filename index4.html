<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2022年度 医系生物 関担当分</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --surface-bg: rgba(22, 27, 34, 0.75);
            --border-color: rgba(88, 166, 255, 0.2);
            --text-main: #e6edf3;
            --text-sub: #8b949e;
            --accent-color: #58a6ff;
            --accent-glow: rgba(88, 166, 255, 0.4);
            --correct-color: #3fb950;
            --incorrect-color: #f85149;
            --essay-color: #bc8cff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
            background-color: var(--bg-color);
            background: radial-gradient(circle at 50% 0%, #161b22 0%, #0d1117 80%);
            color: var(--text-main);
            line-height: 1.8;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            width: 100%;
            max-width: 1000px;
            padding: 40px 20px 20px 20px;
            text-align: center;
        }

        header h1 {
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: 2px;
            background: linear-gradient(to right, #58a6ff, #bc8cff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 5px;
        }

        header p {
            color: var(--text-sub);
            font-size: 0.95rem;
        }

        main {
            width: 100%;
            max-width: 1000px;
            padding: 0 20px 50px 20px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        .view-section {
            display: none;
            animation: fadeIn 0.4s ease-out forwards;
        }

        .view-section.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* メニュー画面 */
        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .menu-btn {
            background: var(--surface-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 25px 20px;
            color: var(--text-main);
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            text-align: left;
            display: flex;
            flex-direction: column;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        .menu-btn:hover {
            border-color: var(--accent-color);
            box-shadow: 0 0 20px var(--accent-glow);
            transform: translateY(-3px);
            background: rgba(33, 38, 45, 0.9);
        }

        .menu-btn .btn-title {
            color: var(--accent-color);
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .menu-btn .btn-desc {
            color: var(--text-sub);
            font-size: 0.9rem;
            font-weight: 400;
            line-height: 1.5;
        }

        /* 問題演習画面 */
        .card {
            background: var(--surface-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 35px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            margin-bottom: 30px;
        }

        .progress-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            color: var(--text-sub);
            font-size: 1rem;
            font-weight: bold;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 15px;
        }

        .q-text {
            font-size: 1.15rem;
            color: var(--text-main);
            text-align: justify;
        }

        /* 入力エリアのデザイン */
        input[type="text"] {
            background: rgba(13, 17, 23, 0.8);
            border: 1px solid transparent;
            border-bottom: 2px solid var(--accent-color);
            color: #ffffff;
            font-size: 1.1rem;
            padding: 4px 8px;
            margin: 2px 6px;
            width: 140px;
            text-align: center;
            border-radius: 6px 6px 0 0;
            transition: all 0.3s ease;
            display: inline-block;
        }

        input[type="text"]:focus {
            outline: none;
            background: rgba(88, 166, 255, 0.1);
            border-bottom-color: #79c0ff;
            box-shadow: 0 4px 12px rgba(88, 166, 255, 0.15);
        }

        input[type="text"]::placeholder {
            color: rgba(88, 166, 255, 0.4);
            font-size: 0.95rem;
        }

        input[type="text"].correct {
            border-bottom-color: var(--correct-color);
            color: var(--correct-color);
            background: rgba(63, 185, 80, 0.1);
            font-weight: bold;
        }

        input[type="text"].incorrect {
            border-bottom-color: var(--incorrect-color);
            color: var(--incorrect-color);
            background: rgba(248, 81, 73, 0.1);
        }

        .feedback-ans {
            color: var(--correct-color);
            font-size: 0.95rem;
            font-weight: 700;
            margin-left: 4px;
            margin-right: 8px;
            display: inline-block;
            animation: fadeIn 0.3s ease;
        }

        /* 論述問題 */
        .essay-block {
            background: linear-gradient(90deg, rgba(188, 140, 255, 0.08) 0%, transparent 100%);
            border-left: 4px solid var(--essay-color);
            padding: 15px 25px;
            margin: 25px 0;
            border-radius: 0 12px 12px 0;
        }

        .essay-title {
            color: var(--essay-color);
            font-weight: 700;
            font-size: 1.05rem;
            margin-bottom: 10px;
            letter-spacing: 1px;
        }

        /* テーブル */
        table {
            width: 100%;
            border-collapse: collapse;
            margin: 25px 0;
            font-size: 1rem;
            background: rgba(255,255,255,0.02);
            border-radius: 8px;
            overflow: hidden;
        }

        th, td {
            border: 1px solid rgba(255,255,255,0.1);
            padding: 12px;
            text-align: center;
            vertical-align: middle;
        }

        th {
            background: rgba(88, 166, 255, 0.15);
            color: var(--accent-color);
            font-weight: 700;
        }

        /* コントロールボタン */
        .controls {
            display: flex;
            gap: 20px;
        }

        .btn {
            padding: 16px 32px;
            font-size: 1.1rem;
            font-weight: 700;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.2s ease;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            letter-spacing: 1px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #238636, #2ea043);
            color: #ffffff;
            flex-grow: 2;
            box-shadow: 0 4px 15px rgba(46, 160, 67, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(46, 160, 67, 0.4);
            background: linear-gradient(135deg, #2ea043, #3fb950);
        }

        .btn-secondary {
            background: rgba(255,255,255,0.05);
            color: var(--text-main);
            border: 1px solid rgba(255,255,255,0.1);
            flex-grow: 1;
        }

        .btn-secondary:hover {
            background: rgba(255,255,255,0.15);
        }
    </style>
</head>
<body>

    <header>
        <h1>2022年度 医系生物 過去問演習</h1>
        <p>関担当分 (全11問収録)</p>
    </header>

    <main>
        <section id="menu-view" class="view-section active">
            <div class="menu-grid" id="menu-grid"></div>
        </section>

        <section id="quiz-view" class="view-section">
            <div class="progress-bar">
                <span id="display-title">問1</span>
                <span id="display-page">Page 1 / 1</span>
            </div>
            <div class="card">
                <div id="quiz-content" class="q-text"></div>
            </div>
            <div class="controls">
                <button class="btn btn-secondary" onclick="returnToMenu()">メニューへ戻る</button>
                <button class="btn btn-primary" id="action-btn" onclick="processAction()">採点する</button>
            </div>
        </section>
    </main>

    <script>
        // ==========================================
        // 効果音エンジン (Web Audio API)
        // ==========================================
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'click') {
                osc.type = 'sine'; osc.frequency.setValueAtTime(600, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
                osc.start(); osc.stop(audioCtx.currentTime + 0.05);
            } else if (type === 'correct') {
                osc.type = 'sine'; osc.frequency.setValueAtTime(880, audioCtx.currentTime);
                osc.frequency.setValueAtTime(1100, audioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
                osc.start(); osc.stop(audioCtx.currentTime + 0.3);
            } else if (type === 'incorrect') {
                osc.type = 'sawtooth'; osc.frequency.setValueAtTime(200, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
                osc.start(); osc.stop(audioCtx.currentTime + 0.3);
            }
        }

        // ==========================================
        // 過去問 全データ構造
        // ==========================================
        const dataset = [
            {
                id: 1, title: "問1", desc: "生命の誕生と進化論",
                pages: [
                    {
                        html: `次の問いに答えよ。<br><br>
                        [1] 地球で有機物ができて生命が誕生するまでの過程をなんというか答えよ。<br>➔ [[1]]<br><br>
                        [2] 現代の進化論のうち、ダーウィンが提唱した説を答えよ。<br>➔ [[2]]<br><br>
                        [3] 木村資生が「分子進化に関与する突然変異の多くは自然選択に対して有利でも不利でもなく、ほとんど無関係で、偶然に発生した突然変異遺伝子が集団内へ固定する」と提唱した説を答えよ。<br>➔ [[3]]<br><br>
                        [4] 細胞内にあるミトコンドリアや葉緑体は独立して生活していた真正細菌が進化の過程で水平的に真核細胞に取り込まれ、細胞小器官となったとされる。この説をなんというか答えよ。<br>➔ [[4]]<br><br>
                        [5] DNAやRNAの塩基配列やタンパク質のアミノ酸配列の比較から、各遺伝子間の塩基(アミノ酸)置換数が推定される。この置換数を用いて系統樹を作成することが可能であるが、このような系統樹をなんというか答えよ。<br>➔ [[5]]`,
                        answers: {
                            "1": ["化学進化"], "2": ["自然選択説"], "3": ["中立説"], "4": ["細胞内共生説"], "5": ["分子系統樹"]
                        }
                    }
                ]
            },
            {
                id: 2, title: "問2", desc: "PCR法とウイルスの検出",
                pages: [
                    {
                        html: `[1] 次の文章中にあてはまる語句を答えよ。<br><br>
                        [[1]] は、増幅させたいゲノムDNA、そのDNA領域を含む2種類のオリゴヌクレオチドプライマー、基質となる4種類のデオキシリボヌクレオシド三リン酸(dNTP)、[[2]] などをマイクロチューブに入れ、[[3]]、[[4]]、[[5]] を繰り返すことにより、特定のDNA領域をin vitro(体外)で指数的に増幅させる反応である。<br><br>
                        [2] DNAコピーが8コピーあり、PCRにより、問2［1］の[[3]]、[[4]]、[[5]]を5回繰り返した場合のコピー数を答えよ。<br>➔ [[6]]<br><br>
                        <div class="essay-block">
                            <div class="essay-title">[3] 論述問題（解答欄省略）</div>
                            <p>RNAウイルスである新型コロナウイルスへの感染をどのような手順で検出するか、［1］の(1)の方法を用いて、「逆転写反応」を交えながら説明してください。</p>
                        </div>`,
                        answers: {
                            "1": ["PCR法", "PCR"], "2": ["耐熱性ポリメラーゼ", "耐熱性DNAポリメラーゼ"], 
                            "3": ["熱変性"], "4": ["アニーリング"], "5": ["伸長反応"], 
                            "6": ["256コピー", "256", "２５６"]
                        }
                    }
                ]
            },
            {
                id: 3, title: "問3", desc: "体細胞分裂と減数分裂の比較",
                pages: [
                    {
                        html: `体細胞分裂と減数分裂の特徴を表した次の表について、空欄にあてはまる適切な内容を記入しなさい。<br><br>
                        <table>
                            <tr>
                                <th>特徴</th>

                                <td><b>目的</b></td>

                                <td>[[9]]</td>
                            </tr>
                            <tr>
                                <td><b>娘細胞の染色体の構成</b></td>
                                <td>[[5]]</td>
                                <td>[[10]]</td>
                            </tr>
                        </table>
                        <span style="font-size:0.9rem; color:var(--text-sub);">※ヒント（以下を参考に解答してください）：<br>
                        目的: 体細胞の増殖 / 生殖細胞の形成<br>
                        分裂回数: 1回 / 2回<br>
                        娘細胞の個数: 2個 / 4個<br>
                        娘細胞の染色体数: 母細胞と同じ / 母細胞から半減<br>
                        娘細胞の染色体の構成: 母細胞と同じ / 生殖細胞ごとに異なる</span>`,
                        answers: {
                            "1": ["体細胞の増殖"], "2": ["1回", "１回", "1", "１"], "3": ["2個", "２個", "2", "２"], "4": ["母細胞と同じ"], "5": ["母細胞と同じ"],
                            "6": ["生殖細胞の形成"], "7": ["2回", "２回", "2", "２"], "8": ["4個", "４個", "4", "４"], "9": ["母細胞から半減", "半減"], "10": ["生殖細胞ごとに異なる", "異なる"]
                        }
                    }
                ]
            },
            {
                id: 4, title: "問4", desc: "体細胞分裂の各期の挙動 (1/3)",
                pages: [
                    {
                        html: `次の文章中にあてはまる語句を解答欄に記入しなさい。（語群は省略しています）<br><br>
                        クロマチンとは、真核細胞の [[1]] 内に存在する [[2]] とタンパク質の複合体で、5種類の [[3]] タンパク質に [[2]] が巻き付いた [[4]] が折りたたまれたものである。<br><br>
                        体細胞分裂前期には、クロマチンが凝縮しはじめ、太くて短いコイル状の染色体になる。それぞれの染色体は、[[5]] と呼ばれる同じ遺伝情報をもつ2本の [[6]] からなり、[[7]] と呼ばれるタンパク質複合体によって接着して結びついている。2つの中心体がモータータンパク質であるキネシンによって両極に離れはじめる。また、[[8]] の構造が崩れはじめる。`,
                        answers: {
                            "1": ["核"], "2": ["DNA"], "3": ["ヒストン"], "4": ["ヌクレオソーム"], 
                            "5": ["姉妹染色分体"], "6": ["染色分体"], "7": ["コヒーシン"], "8": ["ゴルジ装置"]
                        }
                    },
                    {
                        html: `問4 続き<br><br>
                        体細胞分裂中期には [[9]] は完全にみえなくなり、[[10]] の二重構造が消失する。[[11]] が両極に到達し、その周囲の [[12]] からなる放射状の糸状構造をした [[13]] が発達しはじめる。2つの [[11]] から [[12]] が伸びて染色体のセントロメア上に形成された [[14]] に結合し、[[15]] が形成される。<br><br>

                        answers: {

                    {

                        体細胞分裂後期には、[[5]] を接着していた [[7]] が分解され、接着が解除される。そして、紡錘糸を構成するチューブリンが [[18]] することで次第に短くなり、各染色分体が両極に向けて移動する。<br><br>
                        体細胞分裂終期には、両極に到達した染色体は、コイルが解けて [[19]] し、クロマチンに戻る。前期に消失していた [[8]]、[[9]]、および [[10]] が再形成される。細胞の [[16]] 付近で [[20]] と呼ばれるくびれが入りはじめる。<br><br>

                        answers: {
                            "5": ["姉妹染色分体"], "7": ["コヒーシン"], "18": ["脱重合"], "19": ["脱凝縮"],

            {
                id: 5, title: "問5", desc: "減数分裂のプロセス",
                pages: [
                    {
                        html: `次の文中のカッコ内に入れる最も適切なものを解答欄に記せ。（語群省略）<br><br>
                        精子や卵子といわれる生殖細胞には、染色体が普通の体細胞(2n)の半数(n)しか含まれていない。これは生殖細胞が形成される分裂過程において、染色体数が半減するために起こるものである。このような細胞分裂を [[1]] という。<br><br>
                        前期では、核内の糸状のクロマチン繊維がみられるようになり、相同なものどうしが側面で対合する。クロマチン繊維が太くなり染色体になると、2本の染色分体からなる [[2]] どうしが対合して4本の染色分体からなる [[3]] を形成する。[[3]] では、[[2]] どうしが [[4]] によって一部の配列をとりかえる「相同組換え」が起きる。<br><br>
                        中期になると、微小管は星状体が離れるに従ってチューブリンが重合して伸びていく。これにより、[[3]] のセントロメアは赤道面に整列する。<br><br>

        // ==========================================
        // 状態管理変数
        // ==========================================
        let currentQuestion = null;
        let currentPageIdx = 0;
        let globalAnswers = {}; // ページ内でのリアルタイム同期用
        let isGraded = false;

        const menuView = document.getElementById('menu-view');
        const quizView = document.getElementById('quiz-view');
        const menuGrid = document.getElementById('menu-grid');
        const quizContent = document.getElementById('quiz-content');
        const actionBtn = document.getElementById('action-btn');
        const displayTitle = document.getElementById('display-title');
        const displayPage = document.getElementById('display-page');

        // ==========================================
        // UI制御
        // ==========================================
        function initMenu() {
            menuGrid.innerHTML = "";
            dataset.forEach(q => {
                const btn = document.createElement('div');
                btn.className = "menu-btn";
                btn.onclick = () => selectQuestion(q.id);
                btn.innerHTML = `
                    <div class="btn-title">${q.title}</div>
                    <div class="btn-desc">${q.desc}</div>
                `;
                menuGrid.appendChild(btn);
            });
        }

        function selectQuestion(id) {
            playSound('click');
            currentQuestion = dataset.find(q => q.id === id);
            currentPageIdx = 0;
            globalAnswers = {};
            
            menuView.classList.remove('active');
            quizView.classList.add('active');
            renderPage();
        }

        function returnToMenu() {
            playSound('click');
            quizView.classList.remove('active');
            menuView.classList.add('active');
            initMenu();
        }

        function renderPage() {
            isGraded = false;
            const page = currentQuestion.pages[currentPageIdx];
            displayTitle.innerText = currentQuestion.title;
            displayPage.innerText = `Page ${currentPageIdx + 1} / ${currentQuestion.pages.length}`;
            
            // [[n]] をプレースホルダー付きinputに置換
            let processedHtml = page.html.replace(/\[\[(\d+)\]\]/g, (match, num) => {
                return `<input type="text" class="quiz-input" data-qid="${num}" placeholder="[${num}]">`;
            });
            
            quizContent.innerHTML = processedHtml;
            actionBtn.innerText = "採点する";

            // イベントバインドと同一ページ内同期
            const inputs = quizContent.querySelectorAll('.quiz-input');
            inputs.forEach(input => {
                const qid = input.getAttribute('data-qid');
                if (globalAnswers[qid]) {
                    input.value = globalAnswers[qid];
                }
                
                input.addEventListener('input', (e) => {
                    const value = e.target.value;
                    globalAnswers[qid] = value;
                    const peers = quizContent.querySelectorAll(`.quiz-input[data-qid="${qid}"]`);
                    peers.forEach(peer => { if (peer !== e.target) peer.value = value; });
                });
            });
        }

        function processAction() {
            if (!isGraded) {
                gradePage();
            } else {
                nextStep();
            }
        }

        function gradePage() {
            const page = currentQuestion.pages[currentPageIdx];
            const inputs = quizContent.querySelectorAll('.quiz-input');
            let allCorrect = true;

            if (inputs.length === 0) {
                // 入力欄がない（論述のみ）場合
                playSound('correct');
                isGraded = true;
                advanceButtonState();
                return;
            }

            // 採点処理
            inputs.forEach(input => {
                input.disabled = true;
                const qid = input.getAttribute('data-qid');
                const userAns = input.value.trim();
                const validList = page.answers[qid] || [];

                const isCorrect = validList.some(correct => correct === userAns);

                if (isCorrect) {
                    input.classList.add('correct');
                } else {
                    input.classList.add('incorrect');
                    allCorrect = false;
                    
                    const feedback = document.createElement('span');
                    feedback.className = 'feedback-ans';
                    feedback.innerText = `(${validList[0]})`;
                    input.parentNode.insertBefore(feedback, input.nextSibling);
                }
            });

            if (allCorrect) {
                playSound('correct');
            } else {
                playSound('incorrect');
            }

            isGraded = true;
            advanceButtonState();
        }

        function advanceButtonState() {
            if (currentPageIdx < currentQuestion.pages.length - 1) {
                actionBtn.innerText = "次のページへ";
            } else {
                actionBtn.innerText = "メニューへ戻る";
            }
        }

        function nextStep() {
            playSound('click');
            if (currentPageIdx < currentQuestion.pages.length - 1) {
                currentPageIdx++;
                renderPage();
            } else {
                returnToMenu();
            }
        }

        // アプリケーション開始
        initMenu();
    </script>
