<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2024年度 医系生物 関・山﨑担当分</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --surface-bg: rgba(22, 32, 51, 0.75);
            --border-color: rgba(56, 189, 248, 0.2);
            --text-main: #f1f5f9;
            --text-sub: #94a3b8;
            --accent-color: #38bdf8;
            --accent-glow: rgba(56, 189, 248, 0.4);
            --correct-color: #4ade80;
            --incorrect-color: #f87171;
            --essay-color: #c084fc;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
            background-color: var(--bg-color);
            background: radial-gradient(circle at 50% 0%, #1e293b 0%, #0b0f19 75%);
            color: var(--text-main);
            line-height: 1.8;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            width: 100%;
            max-width: 1000px;
            padding: 30px 20px 20px 20px;
            text-align: center;
        }

        header h1 {
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: 2px;
            background: linear-gradient(to right, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 5px;
        }

        header p {
            color: var(--text-sub);
            font-size: 0.9rem;
        }

        main {
            width: 100%;
            max-width: 1000px;
            padding: 0 20px 40px 20px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        .view-section {
            display: none;
            animation: fadeIn 0.4s ease-out forwards;
        }

        .view-section.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* メニュー画面 */
        .menu-intro {
            text-align: center;
            margin-bottom: 30px;
            color: var(--text-main);
            font-size: 1.1rem;
        }

        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        .menu-btn {
            background: var(--surface-bg);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 25px 20px;
            color: var(--text-main);
            font-size: 1.2rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            text-align: left;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
            backdrop-filter: blur(10px);
        }

        .menu-btn:hover {
            border-color: var(--accent-color);
            box-shadow: 0 0 20px var(--accent-glow);
            transform: translateY(-2px);
            background: rgba(30, 41, 59, 0.9);
        }

        .menu-btn .btn-title {
            color: var(--accent-color);
            font-size: 1.4rem;
            margin-bottom: 8px;
        }

        .menu-btn .btn-desc {
            color: var(--text-sub);
            font-size: 0.85rem;
            font-weight: 400;
            line-height: 1.4;
        }

        /* 問題演習画面 */
        .card {
            background: var(--surface-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 35px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            backdrop-filter: blur(10px);
            margin-bottom: 25px;
        }

        .progress-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            color: var(--text-sub);
            font-size: 0.9rem;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            padding-bottom: 10px;
        }

        .q-text {
            font-size: 1.1rem;
            color: var(--text-main);
            text-align: justify;
        }

        /* 入力エリアのデザイン */
        input[type="text"] {
            background: rgba(15, 23, 42, 0.6);
            border: none;
            border-bottom: 2px solid var(--accent-color);
            color: #ffffff;
            font-size: 1.05rem;
            padding: 2px 8px;
            margin: 2px 6px;
            width: 160px;
            text-align: center;
            border-radius: 4px 4px 0 0;
            transition: all 0.3s ease;
            display: inline-block;
        }

        input[type="text"]:focus {
            outline: none;
            background: rgba(56, 189, 248, 0.12);
            border-bottom-color: #60a5fa;
            box-shadow: 0 4px 12px rgba(56, 189, 248, 0.1);
        }

        input[type="text"]::placeholder {
            color: rgba(56, 189, 248, 0.35);
            font-size: 0.85rem;
        }

        input[type="text"].correct {
            border-bottom-color: var(--correct-color);
            color: var(--correct-color);
            background: rgba(74, 222, 128, 0.08);
            font-weight: bold;
        }

        input[type="text"].incorrect {
            border-bottom-color: var(--incorrect-color);
            color: var(--incorrect-color);
            background: rgba(248, 113, 113, 0.08);
        }

        .feedback-ans {
            color: var(--correct-color);
            font-size: 0.9rem;
            font-weight: 600;
            margin-left: 4px;
            margin-right: 8px;
            display: inline-block;
            animation: fadeIn 0.3s ease;
        }

        /* 論述問題 */
        .essay-block {
            background: rgba(192, 132, 252, 0.05);
            border-left: 4px solid var(--essay-color);
            padding: 15px 20px;
            margin: 25px 0;
            border-radius: 0 10px 10px 0;
        }

        .essay-title {
            color: var(--essay-color);
            font-weight: bold;
            font-size: 0.95rem;
            margin-bottom: 6px;
        }

        /* テーブル */
        table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
            font-size: 0.95rem;
        }

        th, td {
            border: 1px solid rgba(255,255,255,0.1);
            padding: 10px;
            text-align: center;
        }

        th {
            background: rgba(56, 189, 248, 0.1);
            color: var(--accent-color);
        }

        /* コントロールボタン */
        .controls {
            display: flex;
            gap: 15px;
        }

        .btn {
            padding: 14px 28px;
            font-size: 1.05rem;
            font-weight: 600;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.2s ease;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-primary {
            background: linear-gradient(135deg, #0284c7, #6366f1);
            color: #ffffff;
            flex-grow: 2;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(99, 102, 241, 0.5);
        }

        .btn-secondary {
            background: rgba(255,255,255,0.05);
            color: var(--text-main);
            border: 1px solid rgba(255,255,255,0.1);
            flex-grow: 1;
        }

        .btn-secondary:hover {
            background: rgba(255,255,255,0.1);
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>

        // 効果音エンジン (Web Audio API)

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'click') {
                osc.type = 'sine'; osc.frequency.setValueAtTime(500, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
                osc.start(); osc.stop(audioCtx.currentTime + 0.05);
            } else if (type === 'correct') {
                osc.type = 'sine'; osc.frequency.setValueAtTime(660, audioCtx.currentTime);
                osc.frequency.setValueAtTime(880, audioCtx.currentTime + 0.08);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.25);
                osc.start(); osc.stop(audioCtx.currentTime + 0.25);
            } else if (type === 'incorrect') {
                osc.type = 'triangle'; osc.frequency.setValueAtTime(220, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
                osc.start(); osc.stop(audioCtx.currentTime + 0.3);
            }
        }

                        answers: {

                            "5": ["分裂準備期（G2期）", "分裂準備期", "G2期"], "6": ["細胞分裂期（M期）", "細胞分裂期", "M期"], "7": ["細胞周期"], "8": ["G0期（静止期）", "G0期", "静止期"],

                    },
                    {
                        html: `[1] 続き<br><br>
                        細胞周期の進行は3つのチェックポイントにおいて監視されている。すなわち、栄養や増殖因子が存在するか、DNA修復が完了しているかを監視する[[11]]、DNA複製が完了したか、DNA損傷の修復が完了しているか、染色体分配ができる状態にあるかを監視する[[12]]、紡錘体形成が完了しているかを監視する[[13]] である。<br><br>

                        html: `[1] 細胞死について述べた以下の文について、文中のカッコ内に入る最も適切なものを記述せよ。<br><br>
                        細胞の死には、栄養不足、毒物、外傷などの外的環境要因による[[1]] 細胞死（遺伝子に支配されないネクローシス）と個体の発生や増殖制御でプログラムされた[[2]] 細胞死（遺伝子の支配を受けるアポトーシス）の2種類がある。<br><br>

                            "4": ["浸潤性", "境界は不明瞭", "再発は多い", "転移あり", "足場非依存性", "脱分化", "不死化"],

            {
                id: 8, title: "問8", desc: "人類の進化（食虫類・類人猿・ホモ・サピエンスの特徴比較）",
                pages: [
                    {
                        html: `リクガメや小型哺乳類のような食虫類のなかまから類人猿（テナガザル、オランウータンなど）、ホモ・サピエンス（ヒト）へと進化した。食虫類、類人猿、ホモ・サピエンスの特徴を表した次の表について、空欄に当てはまる語句を記述せよ。<br><br>
                        <table>

                        answers: {

            {
                id: 9, title: "問9", desc: "最先端医療・mRNAワクチン、ADA欠損症のゲノム編集治療",
                pages: [
                    {
                        html: `次の問いに答えよ。（論述問題のため解答欄は省略しています）<br><br>
                        <div class="essay-block">
                            <div class="essay-title">[1] 論述問題（解答欄省略）</div>
                            <p>新型コロナウイルスのmRNAワクチンが抗原として対象としたのはどの部位か、またそれはなぜかを答えよ。</p>
                        </div>
                        <div class="essay-block">
                            <div class="essay-title">[2] 論述問題（解答欄省略）</div>
                            <p>アデノシンデアミナーゼ（ADA）欠損患者からリンパ球を採取し、ADA正常遺伝子を組み込んだベクターを用いてADAの機能を回復したリンパ球を患者に移植することで1990年に世界初の遺伝子治療が成功した。しかしながら、当初、移植した正常リンパ球は幹細胞ではないため治療効果は移植したリンパ球が生きている間に限られていた。そして、2023年にヒト造血幹細胞の体外培養による増殖が可能であるという報告があった。考えられる治療法を「ゲノム編集」などの語句を使い説明せよ。</p>
                        </div>`,
                        answers: {}
                    }
                ]
            }
        ];

        // ==========================================
        // 状態管理変数
        // ==========================================
        let currentQuestion = null;
        let currentPageIdx = 0;
        let globalAnswers = {}; // 大問ごとの入力を保存・同期する
        let isGraded = false;

        // Dom要素取得
        const menuView = document.getElementById('menu-view');
        const quizView = document.getElementById('quiz-view');
        const menuGrid = document.getElementById('menu-grid');
        const quizContent = document.getElementById('quiz-content');
        const actionBtn = document.getElementById('action-btn');
        const displayTitle = document.getElementById('display-title');
        const displayPage = document.getElementById('display-page');

        // ==========================================
        // ビュー制御・レンダリング
        // ==========================================
        function initMenu() {
            menuGrid.innerHTML = "";
            dataset.forEach(q => {
                const btn = document.createElement('button');
                btn.className = "menu-btn";
                btn.onclick = () => selectQuestion(q.id);
                btn.innerHTML = `
                    <div class="btn-title">${q.title}</div>
                    <div class="btn-desc">${q.desc}</div>
                `;
                menuGrid.appendChild(btn);
            });
        }

        function selectQuestion(id) {
            playSound('click');
            currentQuestion = dataset.find(q => q.id === id);
            currentPageIdx = 0;
            globalAnswers = {}; // 入力状態をリセット
            isGraded = false;
            
            menuView.classList.remove('active');
            quizView.classList.add('active');
            renderPage();
        }

        function returnToMenu() {
            playSound('click');
            quizView.classList.remove('active');
            menuView.classList.add('active');
            initMenu();
        }

        function renderPage() {
            isGraded = false;
            const page = currentQuestion.pages[currentPageIdx];
            displayTitle.innerText = currentQuestion.title;
            displayPage.innerText = `Page ${currentPageIdx + 1} / ${currentQuestion.pages.length}`;
            
            // [[n]] をプレースホルダー付きinput要素に全置換
            let processedHtml = page.html.replace(/\[\[(\d+)\]\]/g, (match, num) => {
                return `<input type="text" class="quiz-input" data-qid="${num}" placeholder="(${num})">`;
            });
            
            quizContent.innerHTML = processedHtml;
            actionBtn.innerText = "採点する";

            // 値の復元と同期イベントバインド
            const inputs = quizContent.querySelectorAll('.quiz-input');
            inputs.forEach(input => {
                const qid = input.getAttribute('data-qid');
                if (globalAnswers[qid]) {
                    input.value = globalAnswers[qid];
                }
                
                input.addEventListener('input', (e) => {
                    const value = e.target.value;
                    globalAnswers[qid] = value;
                    // 同じ画面内に同じ問題番号があれば同期
                    const peers = quizContent.querySelectorAll(`.quiz-input[data-qid="${qid}"]`);
                    peers.forEach(peer => { if (peer !== e.target) peer.value = value; });
                });
            });
        }

        // ==========================================
        // 採点アルゴリズム
        // ==========================================
        function processAction() {
            if (!isGraded) {
                gradePage();
            } else {
                nextStep();
            }
        }

        function gradePage() {
            const page = currentQuestion.pages[currentPageIdx];
            const inputs = quizContent.querySelectorAll('.quiz-input');
            let allCorrect = true;

            if (inputs.length === 0) {
                // 穴埋めなし（論述のみ）のページ
                playSound('correct');
                isGraded = true;
                advanceButtonState();
                return;
            }

            // 問7の悪性腫瘍の特徴選択（順不同可の特殊採点）
            if (page.isMaligQuiz) {
                const correctSet = ["浸潤性", "境界は不明瞭", "再発は多い", "転移あり", "足場非依存性", "脱分化", "不死化"];
                let userAnswers = [];
                inputs.forEach(input => {
                    userAnswers.push(input.value.trim());
                    input.disabled = true;
                });

                inputs.forEach(input => {
                    const val = input.value.trim();
                    // 正解リストに含まれており、かつ重複カウントを防ぐ
                    if (correctSet.includes(val)) {
                        input.classList.add('correct');
                    } else {
                        input.classList.add('incorrect');
                        allCorrect = false;
                        const feedback = document.createElement('span');
                        feedback.className = 'feedback-ans';
                        feedback.innerText = `✕`;
                        input.parentNode.insertBefore(feedback, input.nextSibling);
                    }
                });

                // 最後に正解の全容をヒント提示
                if (!allCorrect) {
                    const notice = document.createElement('div');
                    notice.style.marginTop = "15px";
                    notice.style.color = "var(--correct-color)";
                    notice.innerHTML = `<b>【悪性腫瘍の正解リスト】</b> 浸潤性、境界は不明瞭、再発は多い、転移あり、足場非依存性、脱分化、不死化`;
                    quizContent.appendChild(notice);
                }

            } else {
                // 通常の一問一答形式・穴埋め採点
                inputs.forEach(input => {
                    input.disabled = true;
                    const qid = input.getAttribute('data-qid');
                    const userAns = input.value.trim();
                    const validList = page.answers[qid] || [];

                    // 全角半角の差異などを許容する場合はここで調整
                    const isCorrect = validList.some(correct => correct === userAns);

                    if (isCorrect) {
                        input.classList.add('correct');
                    } else {
                        input.classList.add('incorrect');
                        allCorrect = false;
                        
                        // フィードバック表示
                        const feedback = document.createElement('span');
                        feedback.className = 'feedback-ans';
                        feedback.innerText = `（正解: ${validList[0]}）`;
                        input.parentNode.insertBefore(feedback, input.nextSibling);
                    }
                });
            }

            if (allCorrect) {
                playSound('correct');
            } else {
                playSound('incorrect');
            }

            isGraded = true;
            advanceButtonState();
        }

        function advanceButtonState() {
            if (currentPageIdx < currentQuestion.pages.length - 1) {
                actionBtn.innerText = "次のページへ";
            } else {
                actionBtn.innerText = "大問選択へ戻る";
            }
        }

        function nextStep() {
            playSound('click');
            if (currentPageIdx < currentQuestion.pages.length - 1) {
                currentPageIdx++;
                renderPage();
            } else {
                returnToMenu();
            }
        }

        // 初回ロード
        initMenu();
    </script>
