<html lang="ja">
<head>

        }

            gap: 20px;
            margin-top: 30px;
        }

            background: rgba(56, 189, 248, 0.05);
            border: 1px solid var(--accent-color);
            color: var(--accent-color);
            padding: 20px;
            border-radius: 12px;
            font-size: 1.2rem;
            cursor: pointer;

            position: relative;
            overflow: hidden;
        }

            background: var(--accent-color);
            color: var(--bg-color);
            box-shadow: 0 0 25px rgba(56, 189, 248, 0.4);
            transform: translateY(-3px);

            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            backdrop-filter: blur(5px);

        .question-text {
            font-size: 1.1rem;
            margin-bottom: 25px;
        }

        .essay-question {
            background: rgba(255, 255, 255, 0.03);
            border-left: 4px solid #a855f7;
            padding: 15px 20px;
            margin: 20px 0;
            border-radius: 0 8px 8px 0;
            font-style: italic;
        }

        .essay-label {
            color: #a855f7;
            font-size: 0.9rem;
            margin-bottom: 5px;
            font-weight: bold;
        }

        /* Input Styles */
        input[type="text"] {
            background: rgba(255, 255, 255, 0.05);
            border: none;
            border-bottom: 2px solid var(--accent-color);
            color: var(--accent-color);
            font-size: 1.1rem;
            padding: 5px 10px;
            margin: 0 5px;
            width: 140px;
            text-align: center;
            border-radius: 4px 4px 0 0;
            transition: all 0.3s ease;
            font-family: inherit;

            outline: none;
            background: rgba(56, 189, 248, 0.15);
            box-shadow: 0 -2px 10px rgba(56, 189, 248, 0.2) inset;
        }

            color: rgba(255, 255, 255, 0.2);
            font-weight: 300;
        }

        input[type="text"].correct {
            border-bottom-color: var(--correct-color);
            color: var(--correct-color);
            background: rgba(34, 197, 94, 0.1);
        }

        input[type="text"].incorrect {
            border-bottom-color: var(--incorrect-color);
            color: var(--incorrect-color);
            background: rgba(239, 68, 68, 0.1);
        }

            color: var(--correct-color);
            font-size: 0.9rem;
            margin-left: 5px;
            font-weight: bold;
            animation: fadeIn 0.3s;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
            background: rgba(255, 255, 255, 0.02);
        }
        th, td {
            border: 1px solid var(--glass-border);
            padding: 12px;
            text-align: center;
        }
        th {
            background: rgba(255, 255, 255, 0.05);
            color: var(--accent-color);
        }

        .controls {
            display: flex;
            justify-content: space-between;
            margin-top: 30px;
            gap: 15px;

            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            border: none;
            color: white;
            padding: 12px 30px;
            font-size: 1.1rem;
            border-radius: 30px;

            box-shadow: 0 4px 15px rgba(139, 92, 246, 0.3);

            background: linear-gradient(135deg, #60a5fa, #a855f7);

        .btn-secondary:hover {
            background: rgba(255,255,255,0.1);

            text-align: center;
            margin-bottom: 20px;
            color: rgba(255,255,255,0.5);
            font-size: 0.9rem;

        .hidden { display: none !important; }

        // Audio Context (効果音)

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        function playTone(freq, type, duration, vol=0.1) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            gain.gain.setValueAtTime(vol, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
            osc.stop(audioCtx.currentTime + duration);
        }

        function playClick() { playTone(600, 'sine', 0.1, 0.05); }

        let currentQIndex = -1;
        let currentPageIndex = 0;
        let mode = 'menu'; // 'menu', 'quiz', 'result'

        const menuView = document.getElementById('menu-view');
        const questionView = document.getElementById('question-view');
        const menuGrid = document.getElementById('menu-grid');
        const questionContent = document.getElementById('question-content');
        const actionBtn = document.getElementById('action-btn');
        const progressText = document.getElementById('progress-text');

        // ==========================================
        // 初期化・メニュー描画
        // ==========================================
        function initApp() {
            menuGrid.innerHTML = '';
            examData.forEach((q, idx) => {
                const btn = document.createElement('button');
                btn.className = 'menu-btn';
                btn.innerText = q.title;
                btn.onclick = () => {
                    playClick();
                    startQuestion(idx);
                };
                menuGrid.appendChild(btn);
            });
        }

        function switchView(toMenu) {
            if (toMenu) {
                menuView.classList.add('active');
                questionView.classList.remove('active');
            } else {
                menuView.classList.remove('active');
                questionView.classList.add('active');
            }
        }

        // ==========================================
        // 問題進行ロジック
        // ==========================================
        function startQuestion(index) {
            currentQIndex = index;
            currentPageIndex = 0;
            switchView(false);
            renderPage();
        }

        function formatHTML(rawHtml) {
            // [[id]] を入力欄に置換
            return rawHtml.replace(/\[\[(\d+)\]\]/g, (match, id) => {
                return `<input type="text" class="sync-input" data-qid="${id}" placeholder="${id}">`;
            });
        }

        function renderPage() {
            mode = 'quiz';
            const q = examData[currentQIndex];
            const page = q.pages[currentPageIndex];
            
            progressText.innerText = `${q.title} - Page ${currentPageIndex + 1} / ${q.pages.length}`;
            questionContent.innerHTML = formatHTML(page.html);
            
            actionBtn.innerText = "採点して次へ";
            
            // Sync Eventsの設定
            const inputs = document.querySelectorAll('.sync-input');
            inputs.forEach(input => {
                input.addEventListener('input', (e) => {
                    const id = e.target.getAttribute('data-qid');
                    const val = e.target.value;
                    document.querySelectorAll(`.sync-input[data-qid="${id}"]`).forEach(el => {
                        if (el !== e.target) el.value = val;
                    });
                });
            });
        }

        function handleAction() {
            if (mode === 'quiz') {
                playClick();
                gradeCurrentPage();
            } else if (mode === 'result') {
                playClick();
                goToNextPage();
            }
        }

        function gradeCurrentPage() {
            const q = examData[currentQIndex];
            const page = q.pages[currentPageIndex];
            const inputs = document.querySelectorAll('.sync-input');
            
            let allCorrect = true;
            let hasInputs = inputs.length > 0;

            // Q7 特殊処理（順不同許容の簡易実装）
            // 面倒なので入力値とanswers配列のチェックで行う
            
            inputs.forEach(input => {
                input.disabled = true; // 編集不可にする
                const id = input.getAttribute('data-qid');
                const val = input.value.trim();
                const validAnswers = page.answers[id] || [];
                
                let isCorrect = false;
                if (validAnswers.some(ans => ans === val)) {
                    isCorrect = true;
                }

                if (isCorrect) {
                    input.classList.add('correct');
                } else {
                    input.classList.add('incorrect');
                    allCorrect = false;
                    // 正答を表示
                    const ansSpan = document.createElement('span');
                    ansSpan.className = 'correct-answer-display';
                    ansSpan.innerText = ` (${validAnswers[0] || '解答なし'})`;
                    input.parentNode.insertBefore(ansSpan, input.nextSibling);
                }
            });

            if (hasInputs) {
                if (allCorrect) playCorrect();
                else playIncorrect();
            } else {
                playCorrect(); // 論述のみのページ
            }

            mode = 'result';
            
            if (currentPageIndex < q.pages.length - 1) {
                actionBtn.innerText = "次のページへ";
            } else {
                actionBtn.innerText = "メニューに戻る";
            }
        }

        function goToNextPage() {
            const q = examData[currentQIndex];
            if (currentPageIndex < q.pages.length - 1) {
                currentPageIndex++;
                renderPage();
            } else {
                backToMenu();
            }
        }

        function backToMenu() {
            playClick();
            currentQIndex = -1;
            switchView(true);
        }

        // 起動
        initApp();
